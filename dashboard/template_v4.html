<title>Dashboard Gerencial de Canais · Dori (v4)</title>
<!--
  ============================================================================
  Este arquivo e o TEMPLATE **V4** (D-51, 02/09/2026 — Fase 3 da
  reestruturacao). O template_v3.html fica intacto como retorno rapido, MAS
  ele le cubos COM o eixo UF: para reativa-lo e preciso voltar tambem o
  pipeline (git checkout da D-50 ou anterior).

  O QUE O V4 E (decisoes Q8-Q11/Q14 da auditoria de 02/09, aprovadas):
    - exatamente 3 ABAS: Visao Geral, Bandeiras e Categorias. Geografia, SKU
      e R$/kg sairam (a analise por SKU vive DENTRO de Categorias);
    - Visao Geral: 5 cards de KPI + grafico de Evolucao + MATRIZ HIERARQUICA
      EXPANSIVEL Head > Gerente > Sup./Exec. > Vend./RCA (Q8/Q11). O
      Comparativo YTD, a Evolucao por periodo, o Detalhamento e o drill
      sairam — toda navegacao entre niveis e pela EXPANSAO da matriz;
    - Bandeiras: ganhos/quedas + matriz expansivel Bandeira > Categoria;
    - Categorias: mesma estrutura, matriz expansivel Categoria > SKU;
    - filtros: Metrica, Comparar, Ano, Meses, Canal, Categoria e Head (o Head
      e o seletor de escopo do Template Full; some no arquivo por head).
      Gerente, Sup./Exec., Projeto, UF e as buscas de Bandeira/SKU sairam
      (Q9) — bandeira e SKU seguem como DIMENSOES nas matrizes;
    - nenhum elemento desabilitado ou acinzentado em nenhum estado (regra
      global da reestruturacao): o esmaecimento de chips sem dado saiu
      (D-54: opcao sem dado nao esmaece — ela some; ver abaixo);
    - o eixo UF saiu dos cubos (Q10): linhas com 4 indices + 3 metricas.

  Heranca do V2 (29/08/2026) sobre o v1:
    1. filtros recolhiveis (fechados por padrao) — os numeros abrem acima da
       dobra; a linha de estado continua sempre visivel;
    2. chips cientes do recorte: opcao sem NENHUMA linha no periodo/filtros
       atuais ficava esmaecida (classe .semdado). SUPERADO na D-51 (nada
       cinza) e na D-54 (03/09/2026): opcao sem dado nao esmaece, ela SOME;
       ver `atualizarOpcoes`;
    3. ordenacao por clique no cabecalho de qualquer tabela;
    4. recorte persistente e compartilhavel: estado dos filtros serializado
       por ROTULO no hash da URL (#r=…) e no localStorage;
    5. busca de bandeira/SKU ignora acento;
    6. codigos internos de decisao (D-32/D-35) sairam dos textos da TELA —
       continuam nos comentarios do codigo.

  ---------------------------------------------------------------------------
  V3 (31/08/2026) — LOTE 1: confiabilidade e performance. O template_v2.html
  fica INTACTO como retorno rapido, do mesmo jeito que o v1 ficou quando o v2
  nasceu. O que mudou, e so isso:

    F1-C  A pagina de SKU le o CUBO_SKU SEMPRE — e essa camada nao cruza com
          gerente, bandeira nem projeto. No v2 o aviso so aparecia quando havia
          filtro de SKU ativo: com um filtro de GERENTE ligado e nenhum SKU
          selecionado, a tela mostrava o universo inteiro do head/canal calada,
          e o numero nao batia com a Visao Geral. Agora o aviso e da PAGINA.

    F1-D  O balde "DEMAIS BANDEIRAS" e agregacao, nao bandeira: saiu dos
          destaques de ganho/queda (continua na tabela, marcado) e a cobertura
          das nominais passou a ser recalculada SOB O RECORTE — no v2 ela era o
          numero global do config, exibido igual sob qualquer filtro.

    F1-E  renderSkus, renderDrillHead e renderDrillCat passaram a usar o indice
          por mes (IDX_CUBO/IDX_SKU), que somar() ja usava desde o v2; e a
          marcacao de chips sem dado so roda com o painel de filtros aberto.

    F1-A  Barra de periodo (Mes | Trimestre | Semestre | Acumulado) com setas
          para andar entre periodos. Ela ESCREVE na selecao de meses em vez de
          ser um segundo mecanismo de periodo — por isso tudo que ja lia
          `p.atual` (ganhos, perdas, rankings, participacoes, variacoes,
          exportacao, linha de estado, recorte compartilhavel) passou a
          responder sem uma linha de calculo nova. Fica FORA do painel de
          filtros recolhivel, senao ninguem a acharia, e repetida no topo de
          Bandeiras e SKU. Nao atravessa a virada do ano (decisao 31/08/2026).

    F1-G  As tabelas de SKU, Bandeiras e Detalhamento viraram MATRIZ: um
          periodo por coluna ao longo da serie inteira, mais TOTAL, ATUAL,
          ANT., delta e participacao. Antes cada linha entregava dois pontos
          (atual x ano anterior) e pedia que o leitor imaginasse a trajetoria
          entre eles. A granularidade das colunas e a do chip "Agrupar por".

    L3    Devolutiva de 31/08: (a) a matriz para nos 12 periodos mais
          recentes — 24 colunas de mes nao cabiam na tela e ninguem lia as
          primeiras; (b) a barra de Periodo passou a definir TAMBEM a
          granularidade das colunas, porque ter dois controles com os mesmos
          rotulos ("Trimestre" recortando e "Trimestre" agrupando) so
          confundia; (c) os drills viraram matriz igual as demais tabelas.

  NENHUM numero de negocio muda por causa do lote 1. As trocas de F1-E sao
  reescrita de laco com resultado identico; as de F1-C e F1-D corrigem o que a
  tela DIZ (aviso e cobertura), nao o que ela soma.

  V3 LOTE 2 (31/08/2026), pedido do dia:
    P2-A  quarta granularidade: "Ano", alem de mes/trimestre/semestre. O
          seletor "Ver por" mora na barra de Periodo; o chip "Agrupar por"
          SAIU do painel de filtros (era um segundo controle com os mesmos
          rotulos e dessincronizava da barra: com Periodo=Mes e Agrupar=
          Trimestre a tela rotulava 1 mes como um trimestre cheio). Grupo com
          menos meses que o tamanho da granularidade e marcado como parcial,
          nunca exibido como periodo completo.
    P2-A2 o bloco de filtros + barra de Periodo + linha de estado desceu para
          logo abaixo do grafico de Evolucao, perto do conteudo que controla
          (pedido de 31/08). As abas Geografia e R$/kg ganharam a barra de
          Periodo que Bandeiras e SKU ja tinham.
    P2-A3 (pedido seguinte de 31/08) o painel de filtros passou a existir em
          TODAS as abas: e UM no DOM (#fPainel) e posicionarFiltros() o move
          para a aba ativa — abaixo do grafico na Visao Geral, no topo nas
          demais. Os listeners viajam com o no. As copias avulsas da barra de
          Periodo sairam: o painel ja carrega a barra, e duas barras na mesma
          tela era a duplicacao que o L3 matou.
    P2-B  no grafico de Evolucao, a barra do ANO ANTERIOR vem a esquerda e a
          do ATUAL a direita (ordem cronologica, pedido de 31/08); legenda,
          rotulos e tooltip seguem a mesma ordem.
    P2-C  emojis substituidos por texto ou simbolo tipografico e travessao
          removido dos TEXTOS DA INTERFACE (comentarios antigos do codigo
          ficam como estao).
    P2-D  quando DB.meta.recorte_head existe (arquivo gerado por head), o
          titulo e o cabecalho declaram o recorte. A seguranca NAO e esta
          marca: e o run_dashboard.py, que so embute no arquivo as linhas de
          cubo do proprio head.

  V3 LOTE 3 (01/09/2026) — ajustes finos da Visao Geral, decisoes Q1-Q8 do
  pedido do dia:
    L3-A  grafico de Evolucao sem a serie "Media do periodo". Ficam: ano
          anterior, atual e meta (barras, eixo primario) e Δ% vs LY (linha,
          eixo secundario em %) — que ja eram assim.
    L3-B  os atalhos de Periodo (Mes|Trimestre|Semestre|Acumulado + setas)
          SAIRAM do layout (Q1-a: redundantes com "Ver por" na leitura do
          usuario). A selecao de meses continua nos chips "Meses"; o "Ver
          por" fica na mesma barra.
    L3-C  o rotulo "sem filtro de dimensao" nao e mais exibido (Q2) — nem na
          linha de estado, nem no cabecalho do painel; com filtros ativos os
          textos continuam.
    L3-D  no arquivo por head (SO_HEAD) a LINHA do filtro Head fica OCULTA,
          nunca removida (Q4): componente, logica e listeners preservados;
          visibilidade controlada por perfil.
    L3-E  Detalhamento: dimensao Bandeira (top N da aba Bandeiras + balde Σ,
          Q7) e drill -> Categoria em canal/gerente/projeto/UF/bandeira
          (Q6); cat->SKU e head->gerente continuam como eram.
    L3-F  bloco "Meta x Realizado" na Visao Geral (Q5-a), lendo o CUBO_META
          (rota A): meta e realizado PAREADOS pela mesma atribuicao, por
          dimensao Head/Gerente/Executivo/Bandeira/Categoria, colunas por
          mes de meta (Meta|Realizado|Δ|Δ%), drill por categoria, n/d para
          ausencia (Q8). Responde aos filtros que a meta TEM (head, gerente,
          categoria, bandeira); canal/UF/projeto/SKU nao sao eixos da meta e
          a tabela avisa quando estao ativos (mesma regra D-45 do grafico).
    L3-G  rodape textual removido em TODOS os arquivos (Q3-b) — o
          run_dashboard.py parou de gerar o texto; titulo e cabecalho seguem
          declarando o recorte por head (P2-D).

  D-49 (02/09/2026) — REMOCAO DO TEMA METAS (Fase 1 da reestruturacao).
    Sairam por inteiro: a aba Metas (D-44), o bloco Meta x Realizado da
    Visao Geral (L3-F) e a serie de meta no grafico de Evolucao (D-45).
    O pipeline parou de gerar DB.cubo_meta. Motivo: havera NOVO arquivo de
    metas, cruzado pela chave do cliente — a reintegracao esta descrita em
    docs/12 (D-49). Nenhum codigo de meta ficou morto ou oculto no template.

  D-54 (03/09/2026) — VISIBILIDADE DINAMICA DOS BOTOES.
    Regra unica: um botao so aparece quando existe pelo menos UMA linha de
    dado por tras dele no contexto atual. Vale para Canal, Categoria, Head,
    Ano, Meses, o "Top" de Bandeiras, "Limpar filtros" e os botoes de
    exportacao — e para qualquer nivel da hierarquia, porque quem decide e o
    cubo, nunca uma lista de nomes. Opcao sem dado some; opcao sem dado que o
    usuario JA selecionou fica com o contador "0"; linha de filtro com menos
    de duas opcoes some inteira. Nada e desabilitado nem acinzentado — a
    regra global da D-51 continua valendo. Ver `atualizarOpcoes`/`chips`.
    A outra metade da correcao esta no gerador: `filtrar_por_nivel` passou a
    encolher canal, categoria e SKU junto com o perfil (era so o head), que e
    a razao de o painel de um head exibir canal sem nenhuma linha dele.

  D-55 (03/09/2026) — FORMATACAO UNICA DE VALOR.
    `abrev(v, un)` passou a ser a unica formatacao de metrica do painel:
    card, rotulo de barra, tick de eixo, tooltip, celula de matriz, total e
    destaque. Sairam o `rotCurto` do grafico (segunda escada, sem moeda) e a
    `escalaFixa` das matrizes (numero puro com a escala so no cabecalho).
    Escala mil/mi/bi com UMA casa decimal, omitida quando for zero; o "R$"
    vem sempre de METRICAS[F.metrica].un, entao Volume e Caixas nunca o
    recebem. Isto SUPERA a F1-G: a celula da matriz passou a repetir o
    prefixo.

  D-63 (03/09/2026) — PERIODO INICIAL.
    O painel abre no FY corrente ate o ultimo mes FECHADO; sem mes fechado no
    FY corrente, abre no FY anterior inteiro. Antes abria no FY corrente com
    todos os meses, que em setembro e um mes parcial. Ver `periodoInicial`.
    A chave do recorte salvo subiu para v5 para o padrao novo valer uma vez.
  ---------------------------------------------------------------------------

  Este arquivo e o TEMPLATE. A interface inteira vive aqui e e editada a mao.
  O passo `run_dashboard.py` faz exatamente duas substituicoes de texto:

      o marcador de lib       ->  o bundle do Chart.js, embutido
      o par de marcadores      ->  o JSON dos cubos
      de dados

  Os marcadores NAO aparecem escritos neste comentario, de proposito: a troca e
  por busca de texto, e escreve-los aqui faria a substituicao acontecer DENTRO
  do comentario — o Chart.js entraria duas vezes e o JSON iria parar num bloco
  que o navegador ignora. Eles estao declarados em
  `config/config.yaml -> dashboard.marcador_inicio / marcador_fim`, e
  `run_dashboard.py` aborta se cada um nao aparecer exatamente uma vez.

  Nenhuma linha de HTML, CSS ou JS nasce em Python. No ciclo mensal o template
  nao e tocado.

  POR QUE OS DADOS VAO EMBUTIDOS E NAO POR fetch()
  ------------------------------------------------
  O painel e aberto por duplo clique a partir do OneDrive, em file://, e nesse
  protocolo o navegador bloqueia fetch/XHR de arquivo local. Um painel que so
  funciona com servidor nao atende o requisito. Um arquivo, duplo clique, sem
  servidor e sem internet.
  ============================================================================
-->
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --linha:#e3e8ee; --txt:#16202b; --txt2:#5b6b7c;
  --azul:#00539f; --azul2:#e8f0f9; --acento:#f5a623;
  --gd:#1a7f4b; --gdbg:#e8f5ee; --bd:#c0392b; --bdbg:#fdecea;
  --zebra:#fafbfc;
}
*{box-sizing:border-box}
/* O atributo `hidden` perde para qualquer display de classe (ex.: .grid) —
   sem esta regra o card do drill ficava VISIVEL depois do "voltar ao
   agregado", com o conteudo velho (bug relatado em 28/08). */
[hidden]{display:none !important}
body{margin:0;padding:18px 22px 40px;background:var(--bg);color:var(--txt);
  font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.2px}
h1 span{color:var(--azul)}
.sub{color:var(--txt2);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:8px;
  padding:12px 14px;box-shadow:0 1px 2px rgba(16,32,48,.04)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--txt2);font-size:11px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.note{color:var(--txt2);font-size:11px;margin-top:8px;line-height:1.4}

/* ---------------------------------------------------------------- filtros
   (28/08: "menos branco" — painel com fundo azulado, rotulo em azul, chip
   com tinta leve e divisoria discreta entre as linhas)                      */
.filters{background:linear-gradient(180deg,#e9f1fa,#eef3f8);
  border:1px solid #cddcec;border-radius:10px;
  padding:10px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,48,80,.06)}
/* v2: cabecalho do painel de filtros — recolhivel, com resumo sempre a vista */
.fcab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ftog{border:1px solid #bfd3e6;background:#fff;color:var(--azul);border-radius:5px;
  padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
.ftog:hover{border-color:var(--azul)}
.fnum{color:var(--txt2);font-size:11.5px}
.filters.fechado #fBody{display:none}
.filters:not(.fechado) .fcab{margin-bottom:4px}
.frow{display:flex;align-items:flex-start;gap:8px;padding:5px 0;flex-wrap:wrap;
  border-bottom:1px dashed #d3e0ee}
.frow:last-of-type{border-bottom:0}
.flab{min-width:78px;font-size:11px;font-weight:700;color:var(--azul);
  text-transform:uppercase;letter-spacing:.4px;padding-top:5px}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{border:1px solid #bfd3e6;background:#f7fafd;border-radius:20px;
  padding:3px 11px;font-size:12px;cursor:pointer;user-select:none;
  transition:background .12s,border-color .12s,box-shadow .12s;white-space:nowrap}
.chip:hover{border-color:var(--azul);background:#fff}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600;
  box-shadow:0 1px 3px rgba(0,83,159,.28)}
/* D-51: estado "cinza" e PROIBIDO em qualquer template (regra global da
   reestruturacao) — .chip.semdado e .chip.off sairam com a marcacao de
   chips sem dado. Opcao sem linha no recorte mostra o vazio honestamente.
   D-54 (03/09/2026): opcao SEM DADO no recorte atual nao e mais exibida —
   ela some. A unica que fica e a que o proprio usuario selecionou: apagar
   uma selecao dele em silencio seria pior que exibir o zero. Essa carrega o
   marcador abaixo, que e um CONTADOR (o texto "0"), nao um esmaecimento: o
   chip mantem cor, contraste e clique. */
.chip .z0{font-style:normal;font-weight:700;font-size:9.5px;line-height:1;
  margin-left:5px;padding:1px 4px;border-radius:7px;vertical-align:1px;
  background:#fff;color:var(--bd);border:1px solid var(--bd)}
.chip.on .z0{background:rgba(255,255,255,.92);color:#00539f;border-color:#fff}
.mon-wrap{max-height:78px;overflow:auto}
.mini{border:1px solid #bfd3e6;background:#f7fafd;border-radius:5px;
  padding:3px 9px;font-size:11px;cursor:pointer;color:var(--txt2)}
.mini:hover{border-color:var(--azul);color:var(--azul);background:#fff}
.reset{border:1px solid var(--bd);background:#fff;color:var(--bd);border-radius:5px;
  padding:4px 12px;font-size:12px;cursor:pointer;font-weight:600}
.reset:hover{background:var(--bdbg)}
.estado{background:#fff;border-left:3px solid var(--azul);border:1px solid #cddcec;
  border-left-width:3px;border-left-color:var(--azul);border-radius:4px;
  padding:6px 10px;font-size:11.5px;color:var(--txt);margin-top:8px}

/* ------------------------------------------------------------------- abas */
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:2px solid var(--linha);
  flex-wrap:wrap}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;
  color:var(--txt2);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--azul)}
.tab.active{color:var(--azul);border-bottom-color:var(--azul)}
.panel{display:none}.panel.active{display:block}

/* ------------------------------------------------------------------- kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:8px;
  padding:12px 14px;box-shadow:0 1px 2px rgba(16,32,48,.04)}
.kpi .rot{font-size:11px;color:var(--txt2);text-transform:uppercase;
  letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:3px 0 1px}
.kpi .cmp{font-size:11.5px;color:var(--txt2)}
.kpi.destaque{border-left:3px solid var(--acento)}

/* ----------------------------------------------------------------- tabelas */
.scroll{overflow:auto;max-height:460px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 9px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--linha)}
th{position:sticky;top:0;background:#f0f3f7;z-index:2;font-weight:600;
  font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--txt2);
  cursor:pointer}
/* v2: indicador da coluna ordenada (a ordenacao existe de verdade agora) */
th.o-desc::after{content:" ▾";color:var(--azul)}
th.o-asc::after{content:" ▴";color:var(--azul)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;
  background:var(--card);z-index:1;max-width:340px;overflow:hidden;
  text-overflow:ellipsis}
th:first-child{z-index:3;background:#f0f3f7}
tbody tr:nth-child(even) td:first-child{background:var(--zebra)}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover td{background:var(--azul2)}
tfoot td{font-weight:700;border-top:2px solid var(--linha);background:#f0f3f7}
tfoot td:first-child{background:#f0f3f7}
.sobe{color:var(--gd);font-weight:600}
.desce{color:var(--bd);font-weight:600}
.nd{color:var(--txt2);font-style:italic}
/* v3 (F1-D): linha de AGREGACAO numa tabela de ranking — hoje so o balde
   "DEMAIS BANDEIRAS". Nao e um item comparavel aos outros e precisa parecer
   que nao e; o Sigma no rotulo diz isso sem depender da cor. */
tr.balde td{background:#f2f5f9;color:var(--txt2);font-style:italic}
tr.balde td:first-child::before{content:"Σ ";font-style:normal;font-weight:700;
  color:var(--azul)}
/* v3 (F1-C): o .alerta padrao e informativo (ambar). Este marca INCONSISTENCIA
   entre o que o filtro promete e o que a camada consegue aplicar. */
.alerta.erro{background:var(--bdbg);border-left-color:var(--bd)}
/* v3 (F1-A): barra de periodo. Mora FORA do #fBody de proposito — o painel de
   filtros nasce fechado, e um seletor escondido atras do botao "Filtros" nao
   resolveria o problema que ele existe para resolver. */
.pbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;
  padding-top:8px;border-top:1px dashed #d3e0ee}
.pbar .plab{font-size:11px;font-weight:700;color:var(--azul);margin-right:4px;
  text-transform:uppercase;letter-spacing:.4px}
/* L3-B: .pnav e .prot sairam com os atalhos de periodo.
   D-51: .mini[disabled] saiu — nada fica desabilitado/acinzentado. */
/* v3 lote 2 (P2-A3): o painel de filtros movido para o TOPO de uma aba ganha
   respiro embaixo; abaixo do grafico (Visao Geral) o .grid ja da o espaco. */
.panel > .filters:first-child{margin-top:2px}
/* v3 (F1-G): matriz item x periodo.
   D-55 (03/09/2026): a F1-G imprimia numero puro nas colunas da serie e
   declarava a escala UMA vez no cabecalho. A decisao de 03/09 inverte isso —
   cada celula carrega prefixo e escala ("R$ 7 mi"), porque numero que so faz
   sentido depois de ler a nota e numero que alguem le errado. As colunas

<script>
