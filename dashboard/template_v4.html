<script>
"use strict";
/* ===========================================================================
   MOTOR
   Os cubos chegam como inteiros escalados (receita em centavos, peso em gramas,
   caixas em centesimos). Dividir aqui, na leitura, mantem a soma exata: se os
   numeros viessem arredondados em reais, a soma das 72 mil linhas divergiria da
   fato — pouco na tela, mas o bastante para a conferencia nunca fechar.
   =========================================================================== */
/* D-48 (02/09/2026): os cubos chegam COMPACTADOS (gzip+base64). O motivo esta
   medido: com o eixo novo do cubo de SKU — que acabou com os filtros ignorados
   — o JSON cru levaria o painel a 25,8 MB, acima do teto de 25 MB acordado, e
   crescendo ~4% por mes novo de sell-in. Compactado sao ~9,6 MB: MENOR que os
   14,66 MB do painel anterior, que ainda ignorava quatro filtros.
   A descompactacao e assincrona (DecompressionStream, nativo do navegador,
   sem rede) — por isso o motor so e "ligado" depois dela, em prepararDB(). */
let DB, ESC, CAL, D, CUBO, CUBO_SKU, NM, RESTRITO, NIVEL0, IDX_CUBO,
    IDX_SKU, METRICAS, CHAVE_LS;

async function carregarDB(carga){
  if(carga && carga.z === "gzip+base64"){
    if(typeof DecompressionStream !== "function")
      throw new Error("Este navegador nao sabe descompactar os dados deste "
        + "painel. Abra no Microsoft Edge ou no Google Chrome atualizados.");
    const bin = Uint8Array.from(atob(carga.b64), c=>c.charCodeAt(0));
    const fluxo = new Blob([bin]).stream()
                    .pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(fluxo).text());
  }
  return carga;      // painel gerado sem compactacao (caminho de diagnostico)
}

function prepararDB(){
  ESC = DB.escala; CAL = DB.cal; D = DB.dims;
  CUBO = DB.cubo; CUBO_SKU = DB.cubo_sku;
  NM = CAL.length;
  // D-46: arquivo gerado por head (P2-D). Num arquivo de head unico, detalhar
  // "por Head" e uma tabela de uma linha — a opcao sai dos seletores.
  // D-52: arquivo restrito a um nivel (N1/N2/N3). RESTRITO oculta o filtro
  // Head (so o Template Full o tem); NIVEL0 diz em que nivel a matriz
  // hierarquica COMECA (N1 e Full em 0; N2 em 1; N3 em 2).
  RESTRITO = !!(DB.meta && DB.meta.recorte);
  NIVEL0 = ({N2:1, N3:2})[DB.meta && DB.meta.recorte_nivel] || 0;
  /* B1 (auditoria): indice por mes, construido UMA vez. Uma passada de mes
     unico visitava as linhas do cubo inteiro para usar uma fracao; com o
     indice, cada somar() so anda pelas linhas dos meses selecionados. */
  IDX_CUBO = Array.from({length:NM}, ()=>[]);
  for(const l of CUBO) IDX_CUBO[l[0]].push(l);
  IDX_SKU = Array.from({length:NM}, ()=>[]);
  for(const l of CUBO_SKU) IDX_SKU[l[0]].push(l);
  // D-51: sem o eixo UF as metricas comecam na coluna 4.
  METRICAS = {
    val: {rot:"Valor (R$)", col:4, esc:ESC.R, un:"R$"},
    vol: {rot:"Volume (t)", col:5, esc:ESC.P*1000, un:"t"},
    cx : {rot:"Caixas",     col:6, esc:ESC.C, un:"cx"}
  };
  // D-51: os rotulos "fora da hierarquia" (sem estrutura + inativos do
  // saneamento) chegam do gerador — o template nao carrega valor de negocio.
  (DB.rotulos_fora||[]).forEach(r=>{ if(r) ROT_AUSENCIA.add(r); });
  // D-63: a chave subiu de v4 para v5 de proposito — o recorte salvo no
  // navegador vence o padrao de abertura, e todo mundo tinha "set/26" salvo.
  // Subir a chave faz cada arquivo abrir UMA vez no periodo novo; dali em
  // diante o que o usuario escolher volta a ser lembrado.
  CHAVE_LS = "dashDoriCanais.recorte.v5"
    + (DB.meta && DB.meta.recorte ? ".rec."+DB.meta.recorte : "");
}

/* D-48: acessores unicos dos DOIS cubos. O eixo comercial passou a ser o mesmo
   perfil nos dois (head, gerente, sup./exec., canal, projeto), entao a unica
   diferenca que sobrou e a POSICAO das colunas. Concentrar isso aqui e o que
   permitiu apagar todo o codigo de "filtro ignorado na camada de SKU". */
const PERF = (l,sku)=> D.perfil[sku ? l[2] : l[3]];
// D-50: o VENDEDOR (N4) viaja na posicao 5 do perfil.
const P_HEAD=0, P_GER=1, P_SUP=2, P_CAN=3, P_PROJ=4, P_VEND=5;
// D-51: o eixo UF saiu dos cubos (Q10). D-64 (03/09/2026): a BANDEIRA saiu do
// cubo de SKU — nenhuma tela do v4 a lia de la (o acessor `BANDE` so estava
// definido). Cubo principal: 4 indices + 3 metricas; cubo de SKU: 3 + 3.
const BANDE = (l)=> l[1];                 // so no cubo principal
const CATDE = (l,sku)=> sku ? D.sku[l[1]][2] : l[2];

// indices das colunas do calendario
const C_AM=0, C_ROT=1, C_ANO=2, C_MES=3, C_TRI=4, C_SEM=5,
      C_FY=6, C_FYROT=7, C_MFIS=8, C_TFIS=9, C_SFIS=10, C_LY=11;

// Dois estados, de propósito (Solicitação 02, item 1): a comparação contra o
// mesmo período do ano anterior está EMBUTIDA — não é um modo à parte.
const BASES = {
  fis:{rot:"YTD Fiscal (set→)"}, cal:{rot:"YTD Calendário (jan→)"}
};
/* v3 lote 2 (P2-A): quarta granularidade, "Ano". O grupo segue a base ativa
   (ano fiscal ou calendario), como trimestre e semestre ja faziam. */
const GRANS = {mes:"Mês", tri:"Trimestre", sem:"Semestre", ano:"Ano"};
// Tamanho cheio de um grupo, em meses. Grupo com menos meses que isso e
// PARCIAL e a tela diz — rotular 1 mes como "FY2026-T4" era numero enganoso.
const TAM_GRUPO = {mes:1, tri:3, sem:6, ano:12};
function sufixoParcial(nMeses){
  return nMeses < (TAM_GRUPO[F.gran]||1) ? " (parcial)" : "";
}

const F = {
  metrica:"val", base:"fis", gran:"mes",
  fy:null, ano:null, meses:new Set(),
  cat:new Set(), head:new Set(), can:new Set(),
  topBan:50, aba:"geral"
};
/* D-51: estado de expansao das matrizes, por aba. Nao persiste no recorte
   (como o drill tambem nunca persistiu): reabrir comeca recolhido. */
const EXP = {geral:new Set(), band:new Set(), catg:new Set()};

/* ------------------------------------------------------------- formatacao */
const nbsp = s => s.replace(/ /g," ");
function fmtNum(v, casas){
  if(v===null||v===undefined||!isFinite(v)) return null;
  return v.toLocaleString("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas});
}
/* ============================================ formatacao de valor (D-55)
   UMA funcao formata todo numero de metrica do painel — card, big number,
   rotulo de barra, tick de eixo, tooltip, celula de matriz, total, subtotal e
   destaque de ganho/queda. Antes eram DUAS escadas de arredondamento
   diferentes (`abrev` com 2 casas em "mi" e um `rotCurto` proprio do grafico
   com 1, sem unidade nenhuma): a MESMA barra saia com "112,7 mi" no rotulo e
   "R$ 112,74 mi" no tooltip logo acima. Nao ha mais uma segunda escada.

   Escala (decisao de 03/09): mil / mi / bi, UMA casa decimal, omitida quando
   for zero — "R$ 1 mil", "R$ 25 mil", "R$ 1,5 mi", "R$ 25 mi", "R$ 1,2 bi".

   Moeda: o prefixo NUNCA e literal — vem sempre de `METRICAS[F.metrica].un`,
   que e "R$" so em Valor. Volume sai " t", Caixas " cx", e percentual nao
   passa por aqui (fmtPct/fmtParte). A unica excecao legitima e `fmtPreco`:
   R$/kg nao e a metrica selecionada, e uma razao com moeda propria.        */
const ESCALAS = [[1e9,"bi"],[1e6,"mi"],[1e3,"mil"]];
function _casa1(v){
  const r = Math.round(v*10)/10;
  return fmtNum(r, Number.isInteger(r) ? 0 : 1);
}
function _abrevNum(a){
  let i = a>=1e9 ? 0 : a>=1e6 ? 1 : a>=1e3 ? 2 : 3;
  if(i>=3) return fmtNum(a, a<10?2:0);
  // 999.999 arredondaria para "1.000 mil": sobe um degrau em vez de exibir
  // mil unidades da escala de baixo.
  if(i>0 && Math.round(a/ESCALAS[i][0]*10)/10 >= 1000) i--;
  return _casa1(a/ESCALAS[i][0]) + " " + ESCALAS[i][1];
}
function abrev(v, un){
  if(v===null||!isFinite(v)) return "n/d";
  // Sinal "−" (menos de verdade): o hifen do toLocaleString some no meio de
  // uma tabela e uma devolucao liquida passa por faturamento.
  const s = v<0 ? "−" : "", t = _abrevNum(Math.abs(v));
  return nbsp(s + (un==="R$" ? "R$ "+t : t + (un?" "+un:"")));
}
function fmtMetrica(v){
  const m = METRICAS[F.metrica];
  if(v===null||!isFinite(v)) return '<span class="nd">n/d</span>';
  return abrev(v, m.un);
}
function fmtPct(p){
  if(p===null||p===undefined||!isFinite(p))
    return '<span class="nd" title="sem base no ano anterior">n/d</span>';
  const c = p>0?"sobe":(p<0?"desce":"");
  const seta = p>0?"▲":(p<0?"▼":"■");
  const sinal = p>0?"+":(p<0?"−":"");
  return `<span class="${c}">${seta} ${sinal}${fmtNum(Math.abs(p)*100,1)}%</span>`;
}
function fmtDelta(v){
  if(v===null||!isFinite(v)) return '<span class="nd">n/d</span>';
  const c = v>0?"sobe":(v<0?"desce":"");
  const sinal = v>0?"+":(v<0?"−":"");
  return `<span class="${c}">${sinal}${abrev(Math.abs(v),METRICAS[F.metrica].un)}</span>`;
}
// Participacao %: valor simples, mas com o sinal "−" de verdade. Categoria que
// so teve devolucao no periodo tem participacao NEGATIVA, e o hifen do
// toLocaleString some no meio da tabela.
function fmtParte(v){
  if(v===null||v===undefined||!isFinite(v)) return '<span class="nd">n/d</span>';
  const s = v<0 ? "−" : "";
  return `<span class="${v<0?"desce":""}">${s}${fmtNum(Math.abs(v)*100,1)}%</span>`;
}
function fmtPreco(v){
  if(v===null||!isFinite(v)) return '<span class="nd">n/d</span>';
  return nbsp("R$ "+fmtNum(v,2)+" /kg");
}
// Variacao %: base zero/nula OU atual nulo devolvem null (a tela mostra "n/d",
// nunca infinito nem um falso −100%). Base negativa usa o MODULO no denominador,
// para que uma devolucao liquida no LY nao inverta o sinal da variacao.
// (A2: sem a guarda do numerador, `null − ly` coagia a 0 e virava −100% —
// divergindo do espelho Python `pct()`, que devolve None no mesmo caso.)
function varPct(atual, ly){
  if(atual===null || atual===undefined || !isFinite(atual)) return null;
  if(ly===0 || ly===null || !isFinite(ly)) return null;
  return (atual-ly)/Math.abs(ly);
}
function razao(a,b){
  // C9 (auditoria): espelho de div() do Python — isFinite(null) e true em JS,
  // entao null no denominador escapava como Infinity/NaN.
  return (b===null||b===undefined||b===0||!isFinite(b)) ? null : a/b;
}

/* --------------------------------------------------------------- periodos */
function mesesDoFY(fyRot){
  const r=[]; for(let i=0;i<NM;i++) if(CAL[i][C_FYROT]===fyRot) r.push(i); return r;
}
function mesesDoAno(ano){
  const r=[]; for(let i=0;i<NM;i++) if(CAL[i][C_ANO]===ano) r.push(i); return r;
}
// Meses que os chips oferecem, conforme a base escolhida.
function mesesOferecidos(){
  return F.base==="fis" ? mesesDoFY(F.fy) : mesesDoAno(F.ano);
}
function selecionados(){
  // Sem fallback de propósito: selecao vazia é selecao vazia, e a tela diz isso.
  // Se "Nenhum" devolvesse todos os meses, o botao seria indistinguivel de
  // "Todos" e o leitor nao teria como saber qual periodo esta vendo.
  return mesesOferecidos().filter(i=>F.meses.has(i));
}
/* Pre-selecao: todos os meses do ano (fiscal ou calendario) escolhido. O
   universo oferecido e sempre UM ano, entao o LY nunca fica com metade da
   cobertura do atual por acidente — e a linha de estado continua dizendo
   quantos meses do LY existem. */
function preSelecionarMeses(){
  F.meses.clear();
  mesesOferecidos().forEach(i=>F.meses.add(i));
}
/* O par (atual, anterior): o periodo e EXATAMENTE o que esta selecionado, e o
   anterior sao os MESMOS meses do ano anterior, mapeados por ANO_MES_LY —
   juncao explicita, nunca deslocamento. Selecionar 3 meses compara esses 3
   contra os mesmos 3 do LY. A base (fiscal/calendario) decide qual ano emoldura
   a lista de meses e como o YTD do comparativo acumula; nao muda esta conta. */
function periodo(){
  const sel = selecionados();
  if(!sel.length) return {atual:[], pareado:[], ly:[], ref:null, mesesComPar:0};
  const ref = sel[sel.length-1];
  // COMPARATIVO TUDO-OU-NADA (D-35, 28/08/2026, substitui o pareamento
  // parcial da D-32 no AGREGADO): o comparativo com o ano anterior so existe
  // quando TODOS os meses selecionados tem o mesmo mes no LY. Mostrar
  // "Atual R$ 1,17 bi (12 meses) vs LY R$ 375 mi (4 meses)" — mesmo com o Δ
  // pareado — le-se como comparacao de 12 contra 4. Com par incompleto, LY,
  // Δ e Δ% viram n/d e a linha de estado explica; quem quiser comparar par a
  // par seleciona exatamente os meses pareados. As quebras POR MES/PERIODO
  // continuam comparando cada grupo que tem par completo (regra da D-32).
  const comPar = sel.filter(i=>CAL[i][C_LY]>=0);
  const completo = comPar.length===sel.length && comPar.length>0;
  const pareado = completo ? comPar : [];
  return {atual:sel, pareado, ly:pareado.map(i=>CAL[i][C_LY]), ref,
          mesesComPar:comPar.length};
}
/* P2-A3: a barra vive so dentro do #fPainel, que viaja para a aba ativa —
   as copias por aba sairam junto com a duplicacao que elas criavam.
   L3-B (01/09/2026, Q1-a): os ATALHOS de periodo (Mes|Trimestre|Semestre|
   Acumulado + setas de navegacao) sairam do layout — na leitura do usuario
   eram redundantes com o "Ver por". A selecao de meses continua nos chips
   "Meses" do painel de filtros; a barra carrega so o "Ver por". */
const ALVOS_PERIODO = ["fPeriodo"];
/* O painel de filtros e UM no DOM e muda de lugar com a aba: abaixo do
   grafico de Evolucao na Visao Geral, primeiro elemento nas demais. Mover o
   no preserva os listeners; nada e clonado nem re-ligado. */
function posicionarFiltros(aba){
  const fp=el("fPainel");
  if(aba==="geral"){
    const g=el("gridEvo");
    if(fp.previousElementSibling!==g) g.after(fp);
  }else{
    const p=el(aba);
    if(p && p.firstElementChild!==fp) p.insertBefore(fp, p.firstElementChild);
  }
}
function montarPeriodo(){
  /* v3 lote 2 (P2-A): "Ver por" define SO a granularidade das colunas/barras
     (F.gran), sem mexer na selecao de meses. Grupo incompleto aparece
     rotulado como parcial, nunca como periodo cheio.
     L3-B: sobrou so o "Ver por" — os atalhos de periodo sairam do layout. */
  const h = Object.entries(GRANS).map(([k,r])=>
      `<span class="chip${F.gran===k?" on":""}" data-g="${k}">${r}</span>`).join("");
  ALVOS_PERIODO.forEach(id=>{ const e=el(id); if(e) e.innerHTML=h; });
}

// true quando HA comparativo mas nem todo mes selecionado tem par no LY
function parcialLy(p){ return p.ly.length>0 && p.pareado.length<p.atual.length; }
/* YTD (D-32): o lado LY e derivado por ANO_MES_LY — juncao mes a mes — e o
   comparativo usa so os meses PAREADOS. Antes, "YTD Calendario 2025" somava
   os 12 meses de 2025 e comparava com os 4 meses de 2024 que existem na
   serie: crescimento falso. Devolve [meses, pareados, pares_no_LY]. */
// D-35: mesmo tudo-ou-nada do periodo() — acumulado com par incompleto no LY
// fica SEM comparativo (o 4o item devolve quantos meses teriam par, p/ a nota).
function ytdFiscal(ref){
  const fy=CAL[ref][C_FY], mf=CAL[ref][C_MFIS]; const a=[];
  for(let i=0;i<NM;i++)
    if(CAL[i][C_FY]===fy && CAL[i][C_MFIS]<=mf) a.push(i);
  const comPar=a.filter(i=>CAL[i][C_LY]>=0);
  const aP=comPar.length===a.length?comPar:[];
  return [a, aP, aP.map(i=>CAL[i][C_LY]), comPar.length];
}
function ytdCalendario(ref){
  const an=CAL[ref][C_ANO], me=CAL[ref][C_MES]; const a=[];
  for(let i=0;i<NM;i++)
    if(CAL[i][C_ANO]===an && CAL[i][C_MES]<=me) a.push(i);
  const comPar=a.filter(i=>CAL[i][C_LY]>=0);
  const aP=comPar.length===a.length?comPar:[];
  return [a, aP, aP.map(i=>CAL[i][C_LY]), comPar.length];
}

/* --------------------------------------------------------------- filtros
   `ignorar` remove UMA dimensao do filtro — e assim que o denominador da
   participacao % e montado, sem duplicar codigo de agregacao.               */
/* D-51: sobraram tres filtros de dimensao — categoria, canal e head (o
   Head so no Template Full). Os dois cubos aplicam os tres. */
function passaPrincipal(l, ignorar){
  if(ignorar!=="cat" && F.cat.size && !F.cat.has(l[2])) return false;
  if(F.head.size || F.can.size){
    const p = D.perfil[l[3]];
    if(ignorar!=="head"  && F.head.size && !F.head.has(p[P_HEAD])) return false;
    if(ignorar!=="canal" && F.can.size  && !F.can.has(p[P_CAN]))   return false;
  }
  return true;
}
function passaSku(l, ignorar){
  const p = PERF(l, true);
  if(ignorar!=="head"  && F.head.size && !F.head.has(p[P_HEAD])) return false;
  if(ignorar!=="canal" && F.can.size  && !F.can.has(p[P_CAN]))   return false;
  if(ignorar!=="cat" && F.cat.size && !F.cat.has(D.sku[l[1]][2])) return false;
  return true;
}

/* ------------------------------------------------------------- agregacao */
const MZERO = ()=>[0,0,0];
const BASE_MET = 4;               // D-51: 4 indices no cubo principal
const BASE_SKU = 3;               // D-64: 3 indices no cubo de SKU
function somar(meses, chaveFn, ignorar){
  const out = new Map();
  for(const mi of meses){
    const linhas = IDX_CUBO[mi];  // B1: so os meses pedidos
    for(let k=0;k<linhas.length;k++){
      const l = linhas[k];
      if(!passaPrincipal(l, ignorar)) continue;
      const ch = chaveFn ? chaveFn(l, false) : 0;
      if(ch===null) continue;
      let v = out.get(ch);
      if(!v){ v = MZERO(); out.set(ch, v); }
      v[0]+=l[BASE_MET]; v[1]+=l[BASE_MET+1]; v[2]+=l[BASE_MET+2];
    }
  }
  return out;
}
/* B1 (auditoria): memo de total() — Evolucao e Periodo pediam os MESMOS 24
   totais duas vezes, e os denominadores de participacao repetiam o do KPI.
   A chave nao carrega os filtros porque o memo e limpo a cada render(), e
   dentro de um render os filtros nao mudam. */
const MEMO_TOTAL = new Map();
function total(meses, ignorar){
  const k = meses.join(",")+"|"+(ignorar||"");
  let v = MEMO_TOTAL.get(k);
  if(v) return v;
  v = somar(meses, null, ignorar).get(0) || MZERO();
  MEMO_TOTAL.set(k, v);
  return v;
}
function met(v){
  const m = METRICAS[F.metrica];
  return v[m.col-4] / m.esc;
}
function receita(v){ return v[0]/ESC.R; }
function pesoKg(v){ return v[1]/ESC.P; }

/* ================================================================= UI ==== */
function el(id){ return document.getElementById(id); }

// Rotulos de AUSENCIA sempre por ultimo nos chips (pedido de 28/08: "o nao
// atribuido e sempre o ultimo"). As strings espelham config/config.yaml ->
// dimensoes.rotulo_* — se um rotulo mudar la, mude aqui junto (mesma regra
// C2 de nao deixar os dois lados divergirem).
const ROT_AUSENCIA=new Set(["NÃO ATRIBUÍDO","NAO INFORMADO","SEM CANAL",
                            "SEM BANDEIRA","SEM UF"]);
function ausenciaPorUltimo(rot){
  const r=rot||(x=>x);
  return (a,b)=>{
    const ra=ROT_AUSENCIA.has(r(a)), rb=ROT_AUSENCIA.has(r(b));
    if(ra!==rb) return ra?1:-1;
    return String(r(a)).localeCompare(String(r(b)),"pt-BR");
  };
}

/* ============================================= visibilidade dinamica (D-54)
   REGRA UNICA, valida para todo botao do painel: um botao so aparece quando
   existe pelo menos UMA linha de dado por tras dele no contexto atual —
   recorte do arquivo + filtros de dimensao + meses selecionados. Nao ha lista
   de nomes, de cargos, de canais nem de pessoas em lugar nenhum do codigo:
   quem decide e o cubo.

   A regra vive em DUAS camadas, de proposito:
     1. GERACAO (`run_dashboard.py -> filtrar_por_nivel`): o arquivo de um
        colaborador ja nasce sem as dimensoes que nao existem no escopo dele.
        Era esta camada que faltava — ate a D-52 so `perfil` e `head`
        encolhiam, entao o arquivo do head carregava a lista de canais da
        empresa inteira e o painel exibia chip de canal em que o squad nao tem
        uma unica linha. Escopo se resolve no DADO, nao na tela;
     2. INTERFACE (aqui): dentro do arquivo, o que os filtros ativos zeram
        tambem sai da tela.

   Comportamento, item a item:
     * opcao sem dado e SEM selecao  -> nao e desenhada;
     * opcao sem dado JA SELECIONADA -> continua na tela com o contador "0"
       (decisao de 03/09: apagar uma selecao do usuario em silencio e pior que
       exibir o zero). O "0" e um CONTADOR, nao um esmaecimento — o chip
       mantem cor, contraste e clique, e a regra global "nada cinza" da D-51
       segue valendo: zero elementos [disabled]/acinzentados;
     * linha de filtro com menos de DUAS opcoes -> some inteira, porque botao
       sem escolha e poluicao (mesma logica do filtro Head no arquivo por
       nivel, L3-D/D-52 — o que era excecao de um filtro virou a regra geral);
     * "Limpar filtros" so existe quando ha filtro para limpar.

   `passaPrincipal(l, ignorar)` ja sabia remover UMA dimensao do filtro (era
   assim que o denominador da participacao % era montado). A mesma funcao
   responde "esta opcao teria dado se ela mesma nao estivesse filtrando?" —
   nenhuma linha de agregacao foi duplicada para isto.                       */
let OPC = null;
function atualizarOpcoes(){
  const sel = new Set(periodo().atual);
  const can=new Set(), cat=new Set(), head=new Set(), ban=new Set(), mes=new Set();
  for(let mi=0; mi<NM; mi++){
    const linhas = IDX_CUBO[mi], ehSel = sel.has(mi);
    for(let k=0;k<linhas.length;k++){
      const l = linhas[k];
      if(!ehSel){
        // Mes NAO selecionado: basta saber se ele tem dado sob os filtros de
        // dimensao. O mes nunca filtra a si mesmo — senao desmarcar um mes o
        // faria sumir da lista e nao haveria como marca-lo de volta.
        if(passaPrincipal(l, null)){ mes.add(mi); break; }
        continue;
      }
      if(!mes.has(mi) && passaPrincipal(l, null)) mes.add(mi);
      const p = D.perfil[l[3]];
      if(passaPrincipal(l, "canal")) can.add(p[P_CAN]);
      if(passaPrincipal(l, "head"))  head.add(p[P_HEAD]);
      if(passaPrincipal(l, "cat"))   cat.add(l[2]);
      if(passaPrincipal(l, null))    ban.add(l[1]);
    }
  }
  const ano=new Set(), fy=new Set();
  mes.forEach(i=>{ ano.add(CAL[i][C_ANO]); fy.add(CAL[i][C_FYROT]); });
  OPC = {can, cat, head, ban, mes, ano, fy};
  return OPC;
}
/* Desenha os chips de UMA dimensao aplicando a regra acima e devolve quantos
   sobraram — e esse numero que decide se a linha continua na tela. Uma funcao
   so para todas as dimensoes: correcao em um filtro e correcao em todos.    */
function chips(idChips, idLinha, itens, temDado, estaOn, chave, rotulo, marcaZero){
  const vis = itens.filter(x=>temDado(x) || estaOn(x));
  el(idChips).innerHTML = vis.map(x=>{
    const zero = marcaZero!==false && !temDado(x);
    return `<span class="chip${estaOn(x)?" on":""}" data-k="${chave(x)}"${
      zero?' title="sem faturamento neste recorte — continua selecionado"':""
      }>${rotulo(x)}${zero?'<i class="z0">0</i>':""}</span>`;
  }).join("");
  const linha = idLinha && el(idLinha);
  if(linha) linha.hidden = vis.length < 2;
  return vis.length;
}

function montarFiltros(){
  atualizarOpcoes();
  // Metrica e Comparar nao dependem do dado: as tres metricas e as duas bases
  // existem em qualquer recorte. Ficam sempre.
  el("fMetrica").innerHTML = Object.entries(METRICAS)
    .map(([k,v])=>`<span class="chip${F.metrica===k?" on":""}" data-k="${k}">${v.rot}</span>`).join("");
  el("fBase").innerHTML = Object.entries(BASES)
    .map(([k,v])=>`<span class="chip${F.base===k?" on":""}" data-k="${k}">${v.rot}</span>`).join("");
  montarAno(); montarMeses();
  chips("fCat", "frowCat", D.cat.map((c,i)=>[c,i]).sort(ausenciaPorUltimo(x=>x[0])),
        x=>OPC.cat.has(x[1]), x=>F.cat.has(x[1]), x=>x[1], x=>x[0]);
  chips("fCanal", "frowCanal", [...D.canal].sort(ausenciaPorUltimo()),
        c=>OPC.can.has(c), c=>F.can.has(c), c=>c, c=>c);
  chips("fHead", "frowHead", [...D.head].sort(ausenciaPorUltimo()),
        h=>OPC.head.has(h), h=>F.head.has(h), h=>h, h=>h);
  // L3-D/D-52: no arquivo restrito o Head some por PERFIL, e essa regra vence
  // a contagem de opcoes (o Head e o seletor de escopo do Template Full).
  if(RESTRITO) el("frowHead").hidden = true;
  montarTop();
  el("frowLimpar").hidden = !(F.cat.size || F.can.size || F.head.size);
}
/* Chips "Top" da aba Bandeiras: corte maior que o universo de bandeiras do
   recorte e botao que nao muda nada na tela — "Top 300" e "Top 200" sobre 30
   bandeiras entregam a mesma tabela. Ficam os cortes ABAIXO do universo, mais
   o primeiro que o cobre inteiro (o "todas"). Sem marcador "0": aqui a
   ausencia nao e falta de faturamento, e corte redundante. */
function montarTop(){
  const c = DB.corte_bandeira || {};
  // D-65: nivel que exibe TODAS as bandeiras nao tem corte — a linha some.
  if(c.exibir_todas){ el("frowTop").hidden = true; return; }
  const universo = OPC.ban.size;
  const cobre = DB.tops.ban.find(n=>n>=universo);
  chips("topBan", "frowTop", DB.tops.ban,
        n=>n<universo||n===cobre, n=>F.topBan===n, n=>n, n=>n, false);
}
function montarAno(){
  const fis = F.base==="fis";
  const todos = fis ? [...new Set(CAL.map(c=>c[C_FYROT]))]
                    : [...new Set(CAL.map(c=>c[C_ANO]))];
  const tem = x=> fis ? OPC.fy.has(x) : OPC.ano.has(x);
  const on  = x=> fis ? F.fy===x : F.ano===x;
  // D-54: ano sem NENHUM mes com dado sob os filtros atuais sai da lista.
  const vis = todos.filter(x=>tem(x)||on(x));
  el("fAno").innerHTML = vis.map(x=>{
    const zero=!tem(x);
    return `<span class="chip${on(x)?" on":""}" data-t="${fis?"fy":"ano"}" data-k="${x}"${
      zero?' title="sem faturamento sob os filtros atuais"':""
      }>${x}${zero?'<i class="z0">0</i>':""}</span>`;
  }).join("")
    + `<span style="align-self:center;color:var(--txt2);font-size:11px;margin-left:8px">o período segue o ano ${fis?"fiscal":"calendário"}</span>`;
  el("frowAno").hidden = vis.length<2;
}
function montarMeses(){
  // A linha de Meses fica com UMA opcao (diferente das demais): "Todos" e
  // "Nenhum" continuam sendo acoes validas sobre um mes so. Some apenas
  // quando nao sobra mes nenhum.
  const vis = mesesOferecidos().filter(i=>OPC.mes.has(i)||F.meses.has(i));
  el("fMeses").innerHTML = vis.map(i=>{
    const zero=!OPC.mes.has(i);
    return `<span class="chip${F.meses.has(i)?" on":""}" data-k="${i}"${
      zero?' title="sem faturamento sob os filtros atuais"':""
      }>${CAL[i][C_ROT]}${zero?'<i class="z0">0</i>':""}</span>`;
  }).join("");
  el("frowMeses").hidden = !vis.length;
}
/* D-51: buscaChips e a marcacao de chips sem dado (CHAVE_FILTRO /
   marcarChipsVazios) sairam — as buscas de bandeira/SKU nao existem mais e
   estado esmaecido e proibido pela regra global da reestruturacao.
   D-54: a marcacao voltou com OUTRA regra — nao esmaece, esconde (e o que
   sobra selecionado ganha contador). Ver `atualizarOpcoes`/`chips`. */

/* ------------------------------------------------------------ tabela util */
function tabela(cabec, linhas, rodape, classes){
  // v3: `classes` e opcional — uma classe por linha, para marcar linhas que nao
  // sao itens comparaveis (hoje, o balde de bandeiras).
  let h="<thead><tr>"+cabec.map(c=>`<th>${c}</th>`).join("")+"</tr></thead><tbody>";
  h += linhas.map((l,i)=>`<tr${classes&&classes[i]?` class="${classes[i]}"`:""}>`
       +l.map(c=>`<td>${c}</td>`).join("")+"</tr>").join("");
  h += "</tbody>";
  if(rodape) h+="<tfoot><tr>"+rodape.map(c=>`<td>${c}</td>`).join("")+"</tr></tfoot>";
  return h;
}
function vazio(id, msg){
  delete RAW[id];   // tabela vazia nao exporta dado velho
  const t=el(id);   // v2: rerender zera o estado de ordenacao
  if(t){ delete t.dataset.ocol; delete t.dataset.odir; }
  // D-54: sem dado nao ha o que exportar — os botoes ↓CSV/↓XLSX saem do
  // cabecalho do card. Antes eles ficavam na tela e o clique nao fazia nada:
  // `registrarExport` os criava uma vez e nunca os removia, e exportarTabela
  // desistia em silencio porque RAW[id] tinha acabado de ser apagado aqui.
  // Eles voltam sozinhos no primeiro render com dado (registrarExport).
  const btns = t && t.closest(".card") && t.closest(".card").querySelector(".expbtns");
  if(btns) btns.remove();
  el(id).innerHTML = `<tbody><tr><td class="vazio" colspan="9">${msg||"Sem dados para este recorte."}</td></tr></tbody>`;
}

/* ================================================================ RENDER = */
let chart=null;
/* B1 (auditoria): so a ABA ATIVA e renderizada a cada mudanca de filtro — as
   outras quatro ficam marcadas como sujas e renderizam no clique da aba.
   Junto com o indice por mes e o memo de total(), as ~10 milhoes de visitas
   de linha por clique caem para ~1 milhao, sem mudar nenhum numero. */
let SUJAS = {};
function render(){
  const p = periodo();
  MEMO_TOTAL.clear();
  SUJAS = {geral:true, band:true, catg:true};
  atualizarEstado(p);
  // v3 (F1-A)/L3-B: a barra agora carrega so o "Ver por".
  montarPeriodo();
  gravarRecorte();            // v2: persiste o recorte (hash + localStorage)
  if(!p.atual.length){
    ["tabHier","tabBan","tabCat"]
      .forEach(i=>vazio(i,"Nenhum mês selecionado. Escolha ao menos um mês."));
    el("kpis").innerHTML="";
    SUJAS = {};                     // nada a renderizar por aba
    return;
  }
  renderAba(F.aba || "geral", p);
}
function renderAba(aba, p){
  if(!SUJAS[aba]) return;
  p = p || periodo();
  if(!p.atual.length) return;
  if(aba==="geral"){ renderKPIs(p); renderEvolucao(p); renderHier(p); }
  else if(aba==="band") renderBandeiras(p);
  else if(aba==="catg") renderCategorias(p);
  SUJAS[aba]=false;
}
// D-51: reabre uma aba marcando-a suja — e o caminho do clique de expansao.
function rerender(aba){ SUJAS[aba]=true; renderAba(aba); }

function atualizarEstado(p){
  const m=METRICAS[F.metrica];
  const partes=[];
  partes.push(`<b>${m.rot}</b>`);
  partes.push(BASES[F.base].rot);
  if(p.atual.length) partes.push(`período: <b>${CAL[p.atual[0]][C_ROT]} a ${CAL[p.atual[p.atual.length-1]][C_ROT]}</b> (${p.atual.length} meses)`);
  partes.push(`LY: ${p.ly.length ? `<b>${p.ly.length}</b> de ${p.atual.length} meses cobertos` : "<b>sem base</b>"}`);
  // D-35: par incompleto = comparativo agregado DESLIGADO, com o caminho para
  // religa-lo dito na propria tela.
  if(!p.ly.length && p.mesesComPar>0)
    partes.push(`<b>comparativo desligado</b>: só ${p.mesesComPar} de ${p.atual.length} meses têm par no ano anterior. Para comparar par a par, selecione apenas esses meses`);
  const d=[];
  if(F.can.size)  d.push(`${F.can.size} canal(is)`);
  if(F.cat.size)  d.push(`${F.cat.size} categoria(s)`);
  if(F.head.size) d.push(`${F.head.size} head(s)`);
  // L3-C (Q2): sem filtro ativo, nada e exibido — o rotulo "sem filtro de
  // dimensao" saiu dos dois lugares; com filtros ativos os textos continuam.
  if(d.length) partes.push("filtros: "+d.join(" · "));
  // v2: contagem no cabecalho recolhivel, visivel mesmo com o painel fechado.
  el("fAtivos").textContent = d.length
    ? d.length+" filtro(s) de dimensão ativo(s)" : "";
  el("estado").innerHTML=partes.join(" &nbsp;·&nbsp; ");
  el("sub").textContent =
    `${DB.meta.periodo} · ${DB.meta.meses} meses · ${DB.meta.linhas.toLocaleString("pt-BR")} linhas de origem · atualizado em ${DB.meta.gerado_em}`;
}

function renderKPIs(p){
  const a=total(p.atual), l=total(p.ly);
  // D-35: com par completo aP === a; com par incompleto p.ly esta vazio e o
  // comparativo inteiro vira n/d — o sufixo diz o porquê.
  const aP=a;
  const sufP=(!p.ly.length && p.mesesComPar>0)
    ? ` <small title="só ${p.mesesComPar} de ${p.atual.length} meses têm par no ano anterior: comparativo desligado; selecione apenas os meses pareados para comparar">(par incompleto)</small>` : "";
  const itens=[];
  for(const [k,mt] of Object.entries(METRICAS)){
    const va=a[mt.col-4]/mt.esc, vl=l[mt.col-4]/mt.esc, vaP=aP[mt.col-4]/mt.esc;
    const pc=varPct(p.ly.length?vaP:null, p.ly.length?vl:null);
    itens.push(`<div class="kpi${F.metrica===k?" destaque":""}">
      <div class="rot">${mt.rot}</div>
      <div class="val">${abrev(va,mt.un)}</div>
      <div class="cmp">LY ${abrev(p.ly.length?vl:null,mt.un)} &nbsp;·&nbsp; ${fmtPct(pc)}${sufP}</div></div>`);
  }
  // "Faturamento médio/mês" — o rótulo diz exatamente o que a fórmula calcula:
  // receita do período ÷ nº de meses. (Ticket médio não existe como indicador
  // separado: é o preço médio, no card ao lado — decisão D-22, só nas docs.)
  const fmA=razao(receita(a),p.atual.length), fmL=p.ly.length?razao(receita(l),p.ly.length):null;
  const fmAP=p.ly.length?razao(receita(aP),p.pareado.length):null;
  itens.push(`<div class="kpi">
    <div class="rot">Faturamento médio/mês</div>
    <div class="val">${abrev(fmA,"R$")}</div>
    <div class="cmp">LY ${abrev(fmL,"R$")} &nbsp;·&nbsp; ${fmtPct(varPct(fmAP,fmL))}${sufP}</div></div>`);
  const pa=razao(receita(a),pesoKg(a)), pl=p.ly.length?razao(receita(l),pesoKg(l)):null;
  const paP=p.ly.length?razao(receita(aP),pesoKg(aP)):null;
  itens.push(`<div class="kpi">
    <div class="rot">Preço médio</div>
    <div class="val">${fmtPreco(pa)}</div>
    <div class="cmp">LY ${p.ly.length?fmtPreco(pl):'<span class="nd">n/d</span>'} &nbsp;·&nbsp; ${fmtPct(varPct(paP,pl))}${sufP}</div></div>`);
  el("kpis").innerHTML=itens.join("");
}

function grupoPeriodo(i){
  // A7: na base FISCAL os grupos seguem o calendario fiscal (C_TFIS/C_SFIS).
  // Agrupar set/25 como "2025-T3" rasgava o trimestre fiscal que o resto da
  // aba usa; as colunas fiscais ja viajavam no payload e nao eram lidas.
  if(F.gran==="mes") return CAL[i][C_ROT];
  if(F.gran==="ano")
    return F.base==="fis" ? CAL[i][C_FYROT] : String(CAL[i][C_ANO]);
  if(F.base==="fis"){
    if(F.gran==="tri") return CAL[i][C_FYROT]+"-T"+CAL[i][C_TFIS];
    return CAL[i][C_FYROT]+"-S"+CAL[i][C_SFIS];
  }
  if(F.gran==="tri") return CAL[i][C_ANO]+"-T"+CAL[i][C_TRI];
  return CAL[i][C_ANO]+"-S"+CAL[i][C_SEM];
}
/* D-49: a serie de meta do grafico (D-45) saiu com a remocao do tema Metas. */
function renderEvolucao(p){
  const rotulos=[], atual=[], anterior=[];
  const vistos=new Map();
  p.atual.forEach(i=>{
    const g=grupoPeriodo(i);
    if(!vistos.has(g)){ vistos.set(g,[[],[]]); }
    vistos.get(g)[0].push(i);
    const ly=CAL[i][C_LY]; if(ly>=0) vistos.get(g)[1].push(ly);
  });
  for(const [g,[ms,ls]] of vistos){
    // P2-A: grupo com menos meses que a granularidade pede e dito PARCIAL.
    rotulos.push(g+sufixoParcial(ms.length));
    atual.push(met(total(ms)));
    // D-32: o ponto de LY so existe quando TODOS os meses do grupo tem par —
    // comparar um trimestre inteiro com 1/3 dele seria comparacao falsa.
    anterior.push(ls.length===ms.length?met(total(ls)):null);
  }
  const m=METRICAS[F.metrica];
  // Δ% de cada periodo contra o MESMO periodo do LY (28/08) — so onde o par
  // e completo (mesma regra dos pontos de barra clara).
  const variacao=atual.map((v,i)=>{
    const pc=varPct(v,anterior[i]);
    return pc===null?null:pc*100;
  });
  // L3-A (01/09/2026): a serie "Media do periodo" saiu do grafico — o numero
  // continua no KPI "Faturamento medio/mes", que era a mesma conta.
  el("tEvo").textContent=`Evolução · ${m.rot} · ${GRANS[F.gran]}`;
  el("nEvo").innerHTML=`Barra clara (à esquerda) = mesmo período do ano anterior. Barra escura (à direita) = período selecionado.
    Linha laranja = Δ% contra o mesmo período do ano anterior (eixo da direita, em %).
    ${rotulos.some(r=>r.includes("(parcial)"))?"<b>(parcial)</b> marca grupo com menos meses que a granularidade pede: bordas da série ou seleção parcial. ":""}
    ${anterior.filter(v=>v===null).length?"<b>Períodos sem base no ano anterior ficam sem a barra clara e sem o Δ%</b>, não são exibidos como zero.":""}`;
  const ctx=el("cEvo").getContext("2d");
  if(chart) chart.destroy();
  // Rotulo de dados desenhado a mao (afterDatasetsDraw): o bundle embutido e
  // so o Chart.js — sem plugin externo, que violaria o "zero rede" do painel.
  // D-55: o rotulo usa a MESMA `abrev` do eixo e do tooltip, com a unidade da
  // metrica ativa. O `rotCurto` que morava aqui era uma segunda escada de
  // arredondamento, sem moeda: no mesmo grafico o rotulo dizia "112,7 mi" e o
  // tooltip "R$ 112,74 mi".
  const fmtVar=v=>{
    const s=v>0?"+":(v<0?"−":"");
    return s+fmtNum(Math.abs(v),1)+"%";
  };
  const rotuloBarras={id:"rotuloBarras",afterDatasetsDraw(c){
    const g=c.ctx; g.save();
    g.textAlign="center";
    c.data.datasets.forEach((ds,di)=>{
      const meta=c.getDatasetMeta(di);
      if(meta.hidden) return;
      const ehVar=ds.label==="Δ% vs LY";
      // P2-B: a identidade da barra vem do LABEL, nao da posicao — a ordem
      // dos datasets mudou (ano anterior primeiro) e "di===0" marcaria em
      // negrito a barra errada.
      const ehAtual=ds.label==="Atual";
      g.font=(ehAtual||ehVar?"600 ":"")+"9.5px 'Segoe UI',Arial";
      meta.data.forEach((elb,i)=>{
        const v=ds.data[i];
        if(v===null||v===undefined) return;
        if(ehVar){
          g.fillStyle=v>0?"#1a7f4b":(v<0?"#c0392b":"#5b6b7c");
          g.textBaseline="bottom";
          g.fillText(fmtVar(v), elb.x, elb.y-5);
        }else{
          g.fillStyle=ehAtual?"#003a70":"#7d8fa1";
          g.textBaseline=v<0?"top":"bottom";
          g.fillText(abrev(v, m.un), elb.x, v<0?elb.y+3:elb.y-3);
        }
      });
    });
    g.restore();
  }};
  /* P2-B (31/08): ordem CRONOLOGICA das barras — ano anterior a ESQUERDA,
     atual a DIREITA. No Chart.js a posicao lado a lado, a legenda e o tooltip
     seguem a propriedade `order` (ascendente), nao a ordem do array — por
     isso o ano anterior recebe order menor que o atual; as linhas ficam com
     order 1 e 2 para continuarem desenhadas por cima das barras. */
  chart=new Chart(ctx,{type:"bar",data:{labels:rotulos,datasets:[
      {label:"Ano anterior",data:anterior,backgroundColor:"#c2cfdc",borderRadius:3,
       maxBarThickness:46,order:3},
      {label:"Atual",data:atual,backgroundColor:"#00539f",borderRadius:3,
       maxBarThickness:46,order:4},
      // L3-A: a linha tracejada "Media do periodo" saiu (pedido de 01/09).
      {type:"line",label:"Δ% vs LY",data:variacao,yAxisID:"y1",
       borderColor:"#f5a623",backgroundColor:"#f5a623",borderWidth:2,
       pointRadius:3,tension:.3,spanGaps:false,order:1}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      layout:{padding:{top:18}},
      plugins:{legend:{labels:{boxWidth:12,font:{size:11}}},
        tooltip:{callbacks:{label:c=>{
          if(c.parsed.y===null) return c.dataset.label+": n/d";
          if(c.dataset.label==="Δ% vs LY") return "Δ% vs LY: "+fmtVar(c.parsed.y);
          return c.dataset.label+": "+abrev(c.parsed.y,m.un);
        }}}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>abrev(v,m.un),font:{size:10}}},
              // Eixo do Δ%: so grade do eixo principal, para nao poluir.
              y1:{position:"right",grid:{drawOnChartArea:false},
                  ticks:{callback:v=>fmtNum(v,0)+"%",font:{size:10},
                         color:"#b07c1a"}},
              x:{ticks:{font:{size:10}}}}},
    plugins:[rotuloBarras]});
}

/* D-51 (Q8): Comparativo YTD, Evolucao por periodo, o Detalhamento por
   dimensao (quebra/desenharQuebra) e a aba Geografia sairam. O seletor
   "Comparar" continua definindo o ano que emoldura os meses e o pareamento
   LY de todo o painel. */

/* ------------------------------------------------------ rankings genericos */
function ranking(mapA,mapAP,mapL,rot,n,temLy,excluirK){
  // A1: sem nenhum mes de LY coberto (ex.: FY sem ano anterior na serie) nao
  // existe "ganho" nem "queda" — listar o top inteiro como ganho verde de
  // valor cheio afirmaria crescimento onde nao ha base. Mesma regra `temLy`
  // que as demais tabelas ja aplicam.
  // D-32: o delta e calculado sobre o atual PAREADO (mapAP) — quando a
  // cobertura de LY e parcial, ganho/queda compara par com par.
  const itens=[...new Set([...mapA.keys(),...mapL.keys()])].map(k=>{
    const a=mapA.has(k)?met(mapA.get(k)):0;
    const aP=mapAP.has(k)?met(mapAP.get(k)):0;
    const l=temLy?(mapL.has(k)?met(mapL.get(k)):0):null;
    return {k,a,aP,l,d:temLy?aP-l:null,novo:temLy&&!mapL.has(k),sumiu:!mapA.has(k)};
  });
  if(!temLy){
    const msg='<div class="vazio">Sem base completa no ano anterior para este período: não há como medir ganho ou queda.</div>';
    return [msg,msg,itens];
  }
  /* v3 (F1-D): `excluirK` tira uma chave dos DESTAQUES sem tirar da tabela —
     e o caso do balde de bandeiras, que e agregacao e nao decisao de ninguem.
     Fora dos destaques, mas dentro da tabela: e assim que o rodape continua
     reconciliando com a base. */
  const base = (excluirK===null||excluirK===undefined)
    ? itens : itens.filter(i=>i.k!==excluirK);
  const ganhos=base.filter(i=>i.d>0).sort((x,y)=>y.d-x.d).slice(0,n);
  const quedas=base.filter(i=>i.d<0).sort((x,y)=>x.d-y.d).slice(0,n);
  const html=arr=>arr.length?arr.map(i=>
    `<div class="rank"><span class="nm">${rot(i.k)}${i.novo?' <small style="color:var(--gd)">novo</small>':""}${i.sumiu?' <small style="color:var(--bd)">sem faturamento</small>':""}</span>
     <span class="vl">${fmtDelta(i.d)} &nbsp;<small style="color:var(--txt2)">${fmtPct(varPct(i.novo?null:i.aP,i.novo?null:i.l))}</small></span></div>`).join("")
    : '<div class="vazio">Nenhum item nesta direção.</div>';
  return [html(ganhos),html(quedas),itens];
}
/* ================================================== matriz item x periodo (v3)
   F1-G. Antes, cada linha entregava dois pontos — atual e ano anterior — e o
   leitor tinha de imaginar o caminho entre eles. A matriz poe a serie inteira
   na propria linha, na granularidade do chip "Agrupar por".

   A ordenacao padrao e pelo TOTAL DA SERIE, e nao pelo periodo atual: e o que
   mantem o conjunto de linhas ESTAVEL quando se troca o periodo. Fosse pelo
   atual, mudar de trimestre trocaria as linhas embaixo do leitor. Clicar em
   qualquer cabecalho reordena, como em toda tabela do painel. */
/* L3: 24 colunas de mes nao cabem na tela — a rolagem lateral empurrava as
   colunas mais recentes, que sao as que interessam, para fora do campo de
   visao. A matriz para nos 12 periodos MAIS RECENTES. O TOTAL passa a ser o
   das colunas EXIBIDAS, e a nota diz isso: total que nao corresponde ao que
   esta na tela e a maneira mais rapida de perder a confianca do leitor. */
const MAX_COLS_SERIE = 12;
function gruposSerie(){
  const g=new Map();
  for(let i=0;i<NM;i++){
    const k=grupoPeriodo(i);
    if(!g.has(k)) g.set(k,[]);
    g.get(k).push(i);
  }
  return [...g.entries()].map(([rot,meses])=>({rot,meses}));
}
function colunasSerie(){
  const todas=gruposSerie();
  return todas.length>MAX_COLS_SERIE ? todas.slice(-MAX_COLS_SERIE) : todas;
}
// "FY2026-T1" -> "T1/26" · "2026-S2" -> "S2/26" · "set/25" fica como esta.
function rotuloColuna(k){
  const m=String(k).match(/^(?:FY)?(\d{4})-([TS])(\d)$/);
  return m ? m[2]+m[3]+"/"+m[1].slice(2) : k;
}
/* D-55 (03/09/2026): `escalaFixa` SAIU. Ate aqui a matriz escolhia uma escala
   unica pela maior linha, declarava "em R$ mi" no cabecalho e imprimia numero
   puro nas celulas (F1-G, por legibilidade). A decisao de 03/09 e outra: todo
   indicador monetario carrega o prefixo, celula a celula, para que nenhum
   numero da tela dependa de o leitor ter lido a nota. As celulas passam a usar
   a mesma `abrev`/`fmtMetrica` do resto do painel — e a comparacao a olho
   entre colunas continua valida porque a escala de cada celula esta escrita
   nela mesma. */
/* Construtor proprio de tabela: a matriz precisa de classe POR CELULA (serie,
   corte, zero) e de marcar quais colunas sao texto para a ordenacao. Fazer isso
   depois, mexendo no DOM ja montado, era fragil — o HTML ja sai pronto. */
function _cm(x, tag){
  const o = (x!==null && typeof x==="object") ? x : {v:x};
  const at = (o.c?` class="${o.c}"`:"") + (o.t?' data-txt="1"':"");
  return `<${tag}${at}>${o.v===null||o.v===undefined?"":o.v}</${tag}>`;
}
function tabelaMat(cabec,linhas,rodape,classes){
  let h="<thead><tr>"+cabec.map(x=>_cm(x,"th")).join("")+"</tr></thead><tbody>";
  h+=linhas.map((l,i)=>`<tr${classes&&classes[i]?` class="${classes[i]}"`:""}>`
     +l.map(x=>_cm(x,"td")).join("")+"</tr>").join("");
  h+="</tbody>";
  if(rodape) h+="<tfoot><tr>"+rodape.map(x=>_cm(x,"td")).join("")+"</tr></tfoot>";
  return h;
}
/* ========================= matriz EXPANSIVEL por niveis (D-51, Q11)
   Substitui o drill-down: toda navegacao entre niveis e pela EXPANSAO da
   linha (▸ abre, ▾ fecha). UMA agregacao por coluna, chaveada pelo CAMINHO
   completo (niveis unidos por \u0001); os nos acumulam de baixo para cima,
   entao PAI = SOMA DOS FILHOS por construcao — a matriz reconcilia com os
   cards da Visao Geral em qualquer estado de expansao.

   cfg: idTab, aba, niveis:[rotulos], pathFn(l)->array de chaves,
        rotNo(nivel,chave)->rotulo, usaSku, p, den, expSet, topN (nivel 0;
        0 = todos), baldeK|null (chave sintetica no nivel 0),
        foraSet (chaves do nivel 0 exibidas como sintese, sem expansao)     */
const SEP="\u0001";
function matrizNiveis(cfg){
  const p=cfg.p, temLy=p.ly.length>0, nNiv=cfg.niveis.length;
  const soma=ms=>{
    const out=new Map();
    const idx=cfg.usaSku?IDX_SKU:IDX_CUBO;
    const passa=cfg.usaSku?passaSku:passaPrincipal;
    const b=cfg.usaSku?BASE_SKU:BASE_MET;   // D-64: metricas em posicoes distintas
    for(const mi of ms){
      const linhas=idx[mi];
      for(let k=0;k<linhas.length;k++){
        const l=linhas[k];
        if(!passa(l, cfg.ignorar)) continue;
        const ch=cfg.pathFn(l).join(SEP);
        let v=out.get(ch); if(!v){v=MZERO(); out.set(ch,v);}
        v[0]+=l[b]; v[1]+=l[b+1]; v[2]+=l[b+2];
      }
    }
    return out;
  };
  const cols=colunasSerie();
  const porCol=cols.map(c=>soma(c.meses));
  const mapA=soma(p.atual), mapL=temLy?soma(p.ly):new Map();
  const mapAP=parcialLy(p)?soma(p.pareado):mapA;
  // ---- arvore com acumuladores por no
  const raiz={filhos:new Map()};
  function no(path){
    let n=raiz;
    for(const k of path){
      let f=n.filhos.get(k);
      if(!f){ f={k, filhos:new Map(), serie:cols.map(()=>0),
              a:0, aP:0, l:0, temL:false}; n.filhos.set(k,f); }
      n=f;
    }
    return n;
  }
  // Um unico acumulador: `põe(n, valor)` recebe o no de CADA prefixo do
  // caminho — pai soma os filhos por construcao.
  const acum=(mapa,poe)=>{
    mapa.forEach((v,ch)=>{
      const x=met(v), path=ch.split(SEP);
      for(let i=1;i<=path.length;i++) poe(no(path.slice(0,i)), x);
    });
  };
  porCol.forEach((m,ci)=>acum(m,(n,x)=>{ n.serie[ci]+=x; }));
  acum(mapA,(n,x)=>{ n.a+=x; });
  acum(mapAP,(n,x)=>{ n.aP+=x; });
  if(temLy) acum(mapL,(n,x)=>{ n.l+=x; n.temL=true; });
  const tot=n=>n.serie.reduce((s,v)=>s+v,0);
  // ---- nivel 0: ordena por total; sintese/balde por ultimo; topN
  const fora=cfg.foraSet||new Set();
  let n0=[...raiz.filhos.values()].sort((x,y)=>tot(y)-tot(x));
  const sintese=n0.filter(n=>fora.has(n.k)||n.k===cfg.baldeK);
  let normais=n0.filter(n=>!fora.has(n.k)&&n.k!==cfg.baldeK);
  const universo=normais.length;
  /* D-65 (03/09/2026): o corte (topN) e de EXIBICAO. O que ele tira NAO some:
     vira UMA linha sintese Σ somada aqui mesmo, na tela — o dado de todas as
     bandeiras esta no arquivo (o gerador parou de agregar na origem). O
     Total geral continua somando n0 inteiro, exibido ou nao. */
  let resto=null;
  if(cfg.topN>0 && universo>cfg.topN){
    const cortadas=normais.slice(cfg.topN);
    normais=normais.slice(0,cfg.topN);
    resto={k:"__resto__", filhos:new Map(), serie:cols.map(()=>0),
           a:0, aP:0, l:0, temL:false, n:cortadas.length};
    cortadas.forEach(x=>{
      x.serie.forEach((v,i)=>{ resto.serie[i]+=v; });
      resto.a+=x.a; resto.aP+=x.aP;
      if(x.temL){ resto.l+=x.l; resto.temL=true; }
    });
  }
  if(!normais.length && !sintese.length){ vazio(cfg.idTab); return null; }
  const ND='<span class="nd">n/d</span>';
  // D-55: a celula declara a propria escala e a propria moeda. "–" continua
  // sendo ausencia de faturamento, nao zero formatado.
  const num=v=>v===0 ? '<span class="zero">–</span>' : fmtMetrica(v);
  const rotCol=c=>rotuloColuna(c.rot)
    +(c.meses.length<(TAM_GRUPO[F.gran]||1)?"*":"");
  const cabec=[{v:cfg.niveis.join(" › "),t:1}]
    .concat(cols.map(c=>({v:rotCol(c),c:"serie"})))
    .concat([{v:"TOTAL",c:"serie corte"},{v:"ATUAL"},{v:"ANT."},
             {v:"Δ"},{v:"Δ%"},{v:"Part. %"}]);
  const linhas=[], raw=[], classes=[];
  function linhaDo(n, nivel, caminho, ehSintese){
    const abre=!ehSintese && nivel<nNiv-1 && n.filhos.size>0;
    const aberto=abre && cfg.expSet.has(caminho);
    const rot = n.k==="__resto__"
      ? (cfg.rotResto ? cfg.rotResto(n.n) : "Σ")     // D-65: linha do corte
      : cfg.rotNo(nivel, n.k);
    const marca=abre?(aberto?"▾ ":"▸ "):"";
    const nome=`<span class="${nivel?`recuo${nivel}`:""}${abre?" exp":""}"${
      abre?` data-x="${encodeURIComponent(caminho)}" title="${aberto?"recolher":"abrir "+cfg.niveis[nivel+1]}"`:""}>${marca}${rot}</span>`;
    const semLy=!temLy||!n.temL;
    const part=razao(n.a,cfg.den);
    classes.push((nivel===0?"n0":"")+(ehSintese?" fora balde":""));
    linhas.push([{v:nome}]
      .concat(n.serie.map(v=>({v:num(v),c:"serie"})))
      .concat([{v:"<b>"+num(tot(n))+"</b>",c:"serie corte"},
               {v:fmtMetrica(n.a)},
               {v:semLy?ND:fmtMetrica(n.l)},
               {v:semLy?ND:fmtDelta(n.aP-n.l)},
               {v:fmtPct(varPct(semLy?null:n.aP,semLy?null:n.l))},
               {v:fmtParte(part)}]));
    raw.push([cfg.niveis[nivel]+": "+_semHtml(String(rot))]
      .concat(n.serie.map(v=>nr(v)))
      .concat([nr(tot(n)), nr(n.a), semLy?null:nr(n.l),
               semLy?null:nr(n.aP-n.l),
               nr(pctNum(varPct(semLy?null:n.aP,semLy?null:n.l))),
               part===null?null:nr(part*100)]));
    if(aberto)
      [...n.filhos.values()].sort((x,y)=>tot(y)-tot(x))
        .forEach(f=>linhaDo(f, nivel+1, caminho+SEP+f.k, false));
  }
  normais.forEach(n=>linhaDo(n,0,String(n.k),false));
  if(resto) linhaDo(resto,0,"__resto__",true);        // D-65
  sintese.forEach(n=>linhaDo(n,0,String(n.k),true));
  // ---- rodape: TOTAL GERAL = todos os nos do nivel 0 (exibidos ou nao) —
  //      e o numero que fecha com os cards da Visao Geral.
  const g={serie:cols.map(()=>0), a:0, aP:0, l:0, temL:false};
  n0.forEach(n=>{ n.serie.forEach((v,i)=>g.serie[i]+=v);
    g.a+=n.a; g.aP+=n.aP; if(n.temL){g.l+=n.l; g.temL=true;} });
  const gSemLy=!temLy||!g.temL;
  const rodape=[{v:`<b>Total geral</b>${cfg.topN>0&&universo>cfg.topN?` <small>(${normais.length} de ${universo} exibidas + síntese)</small>`:""}`}]
    .concat(g.serie.map(v=>({v:num(v),c:"serie"})))
    .concat([{v:"<b>"+num(g.serie.reduce((s,v)=>s+v,0))+"</b>",c:"serie corte"},
             {v:fmtMetrica(g.a)},
             {v:gSemLy?ND:fmtMetrica(g.l)},
             {v:gSemLy?ND:fmtDelta(g.aP-g.l)},
             {v:fmtPct(varPct(gSemLy?null:g.aP,gSemLy?null:g.l))},
             {v:cfg.den?fmtParte(g.a/cfg.den):"n/d"}]);
  raw.push(["Total geral"]
    .concat(g.serie.map(v=>nr(v)))
    .concat([nr(g.serie.reduce((s,v)=>s+v,0)), nr(g.a),
             gSemLy?null:nr(g.l), gSemLy?null:nr(g.aP-g.l),
             nr(pctNum(varPct(gSemLy?null:g.aP,gSemLy?null:g.l))),
             cfg.den?nr(g.a/cfg.den*100):null]));
  const tb=el(cfg.idTab);
  tb.classList.add("matriz","niveis");
  tb.innerHTML=tabelaMat(cabec,linhas,rodape,classes);
  registrarExport(cfg.idTab,
    ["Item"].concat(cols.map(rotCol))
      .concat(["TOTAL","ATUAL","ANT.","Δ","Δ%","Part. %"]), raw);
  tb.onclick=e=>{
    const s=e.target.closest(".exp"); if(!s) return;
    const c=decodeURIComponent(s.dataset.x);
    cfg.expSet.has(c) ? cfg.expSet.delete(c) : cfg.expSet.add(c);
    rerender(cfg.aba);
  };
  // D-55: a escala nao viaja mais daqui para a nota (cada celula declara a
  // dela). D-65: devolve o que a nota precisa dizer sobre o corte de
  // exibicao — quais chaves do nivel 0 estao nominais, o universo e quantas
  // foram somadas na linha Σ. Objeto = verdadeiro para os chamadores antigos.
  return {exibidas:normais.map(n=>n.k), universo, cortadas:resto?resto.n:0};
}

// "Mês" + "s" = "mêss". Plural declarado, em vez de deduzido.
const GRANS_PL = {mes:"meses", tri:"trimestres", sem:"semestres", ano:"anos"};
function notaMatriz(){
  const cols=colunasSerie();
  const n=cols.length, todas=gruposSerie().length;
  const g=GRANS_PL[F.gran]||GRANS[F.gran].toLowerCase();
  const temParcial=cols.some(c=>c.meses.length<(TAM_GRUPO[F.gran]||1));
  return `Colunas: os <b>${n} últimos ${g}</b>${todas>n?` da série (de ${todas}
    disponíveis)`:""}, em <b>${METRICAS[F.metrica].rot}</b>. A granularidade é o
    seletor <b>Ver por</b> da barra de Período.
    ${temParcial?"<b>*</b> marca período parcial: a série não cobre todos os meses dele. ":""}
    <b>TOTAL</b> é a soma das colunas exibidas.
    <b>ATUAL</b> e <b>ANT.</b> são o período selecionado e os mesmos meses do
    ano anterior; <b>Δ</b> e <b>Δ%</b> comparam esses dois, não a série.
    Ordenado pelo <b>TOTAL</b>, para as linhas não trocarem quando você muda o
    período. <b>–</b> é ausência de faturamento.`;
}

/* ================== matriz hierarquica da Visao Geral (D-51, Q8/Q11)
   Head > Gerente > Sup./Exec. > Vend./RCA, direto do PERFIL do cubo — a
   hierarquia nunca e inferida, cada linha ja carrega os quatro niveis.
   Os rotulos "fora da hierarquia" (sem estrutura, inativos do saneamento)
   viram linhas SINTESE no fim, sem expansao (Q7-i): o historico delas
   permanece no Total geral, que fecha com os cards acima. */
function renderHier(p){
  el("sHier").textContent=" · "+METRICAS[F.metrica].rot+" · "+BASES[F.base].rot;
  // D-52: a profundidade e do TEMPLATE — o arquivo do N2 comeca no gerente,
  // o do N3 no sup./exec. (os niveis acima nem existem no arquivo).
  const NIVEIS=["Head","Gerente","Sup./Exec.","Vend./RCA"].slice(NIVEL0);
  const POSN=[P_HEAD,P_GER,P_SUP,P_VEND].slice(NIVEL0);
  el("cadHier").textContent="· "+NIVEIS.join(" → ");
  const fora=new Set((DB.rotulos_fora||[]).filter(Boolean));
  const temHier=matrizNiveis({idTab:"tabHier", aba:"geral",
    niveis:NIVEIS,
    pathFn:l=>{const pf=D.perfil[l[3]];
      return POSN.map(i=>pf[i]);},
    rotNo:(niv,k)=>k,
    usaSku:false, p, den:met(total(p.atual)), expSet:EXP.geral,
    topN:0, baldeK:null, foraSet:fora, ignorar:null});
  el("nHier").innerHTML=(temHier?notaMatriz()+"<br>":"")
    +`Navegação <b>exclusivamente pela expansão</b>: ▸ abre o nível de baixo
    (Head → Gerente → Sup./Exec. → Vend./RCA); ▾ recolhe. As linhas Σ no fim
    são síntese <b>fora da hierarquia</b> — clientes sem estrutura e inativados
    pelo saneamento (D-50) — sem expansão; o histórico delas permanece no
    <b>Total geral</b>, que fecha com os cards acima. Participação % sobre o
    total do recorte. A hierarquia vem do de-para de estrutura, não é inferida.`;
}

/* D-65 (03/09/2026): o arquivo carrega TODAS as bandeiras do escopo (o
   gerador parou de agregar "DEMAIS BANDEIRAS" na origem). O corte e de
   EXIBICAO: Full e N1 mostram as N maiores DO PROPRIO ARQUIVO (seletor Top) e
   somam o resto numa linha Σ montada na tela (matrizNiveis); N2 e N3 exibem
   todas (`corte_bandeira.exibir_todas`, decidido no gerador pelo config).
   Ganhos e quedas passam a considerar TODAS as bandeiras do escopo — ate a
   D-64 eram calculados so sobre as que estavam no top 300 corporativo, e o
   executivo RS/SC decidia com 13 de 2.930 (medido). Supera a D-57. */
function renderBandeiras(p){
  const fBan=(l)=>l[1];
  const a=somar(p.atual,fBan), l=somar(p.ly,fBan);
  const aP=parcialLy(p)?somar(p.pareado,fBan):a;   // D-32
  const rot=i=>D.ban[i];
  const temLy=p.ly.length>0;
  const c=DB.corte_bandeira||{}, todas=!!c.exibir_todas;
  const [g,q]=ranking(a,aP,l,rot,DB.top_ranking,temLy);
  el("ganhoBan").innerHTML=g; el("quedaBan").innerHTML=q;
  el("sGanhoB").textContent="· por Δ absoluto de "+METRICAS[F.metrica].rot;
  el("sBan").textContent="· "+METRICAS[F.metrica].rot+" · "+BASES[F.base].rot;
  const den=met(total(p.atual));
  const rotResto=n=>`${c.rotulo_base||"DEMAIS BANDEIRAS"} (${n.toLocaleString("pt-BR")} bandeiras)`;
  // D-51 (Step 2.3): a tabela final e a MATRIZ expansivel Bandeira > Categoria.
  const r=matrizNiveis({idTab:"tabBan", aba:"band",
    niveis:["Bandeira","Categoria"],
    pathFn:l=>[l[1], l[2]],
    rotNo:(niv,k)=> niv===0 ? D.ban[+k] : D.cat[+k],
    usaSku:false, p, den, expSet:EXP.band,
    topN: todas ? 0 : F.topBan, baldeK:null, foraSet:null,
    ignorar:null, rotResto});
  const escopo = RESTRITO ? "deste arquivo" : "da base";
  let texto="";
  if(r){
    let nominal=0;
    for(const k of r.exibidas){ const v=a.get(+k); if(v) nominal+=met(v); }
    const cobRec=razao(nominal,den);
    const pct=cobRec===null?"n/d":fmtNum(cobRec*100,1)+"%";
    if(todas)
      texto=`Todas as <b>${r.universo.toLocaleString("pt-BR")}</b> bandeiras
        ${escopo} com faturamento neste recorte aparecem nominalmente: não há
        corte nem linha Σ.`;
    else if(r.cortadas)
      texto=`A tabela exibe as <b>${r.exibidas.length}</b> maiores bandeiras
        ${escopo} neste recorte (seletor <b>Top</b>); as outras
        <b>${r.cortadas.toLocaleString("pt-BR")}</b> ficam somadas na linha Σ
        “${c.rotulo_base||"DEMAIS BANDEIRAS"}”. Elas <b>não somem</b>: o
        <b>Total geral</b> soma todas, e a busca acha qualquer uma delas.
        <b>Neste recorte</b>, as nominais somam <b>${pct}</b> de
        ${METRICAS[F.metrica].rot}.`;
    else
      texto=`Todas as <b>${r.universo.toLocaleString("pt-BR")}</b> bandeiras
        ${escopo} com faturamento neste recorte estão na tabela: o corte de
        ${F.topBan} não deixou nenhuma de fora.`;
  }
  el("nBan").innerHTML=(r?notaMatriz()+"<br>":"")
    +`Clique em ▸ para abrir as <b>categorias</b> da bandeira. ${texto}
    Participação % sobre o total do recorte.`;
}

/* ============================== Categorias (D-51, Step 2.4 — aba nova)
   Mesma estrutura da aba Bandeiras, com a dimensao trocada: ganhos/quedas
   por categoria e MATRIZ expansivel Categoria > SKU. Le o CUBO_SKU, a unica
   camada com o eixo de produto — os totais fecham com o cubo principal
   (ambos reconciliam com a fato ao centavo). */
function renderCategorias(p){
  const fCat=(l)=>l[2];
  const a=somar(p.atual,fCat), l=somar(p.ly,fCat);
  const aP=parcialLy(p)?somar(p.pareado,fCat):a;
  const rot=i=>D.cat[i];
  const temLy=p.ly.length>0;
  const [g,q]=ranking(a,aP,l,rot,DB.top_ranking,temLy);
  el("ganhoCat").innerHTML=g; el("quedaCat").innerHTML=q;
  el("sGanhoC").textContent="· por Δ absoluto de "+METRICAS[F.metrica].rot;
  el("sCat").textContent="· "+METRICAS[F.metrica].rot+" · "+BASES[F.base].rot;
  const den=met(total(p.atual));
  const temCat=matrizNiveis({idTab:"tabCat", aba:"catg",
    niveis:["Categoria","SKU"],
    pathFn:l=>[D.sku[l[1]][2], l[1]],
    rotNo:(niv,k)=> niv===0
      ? (+k>=0 ? D.cat[+k] : "n/d")
      : D.sku[+k][0]+" · "+D.sku[+k][1],
    usaSku:true, p, den, expSet:EXP.catg,
    topN:0, baldeK:null, foraSet:null, ignorar:null});
  el("nCat").innerHTML=(temCat?notaMatriz()+"<br>":"")
    +`Clique em ▸ para abrir <b>todos os SKUs</b> da categoria (sem corte de
    cobertura — os ${D.sku.length} SKUs da base estão aqui). Esta aba lê a
    camada de SKU, que fecha com a Visão Geral sob qualquer filtro (D-48).
    Participação % sobre o total do recorte.`;
}

/* ==================================================== exportacao (CSV/XLSX)/* ==================================================== exportacao (CSV/XLSX)
   Uma funcao generica para TODAS as tabelas (Solicitacao 02, item 2). Cada
   render registra a versao CRUA dos dados (numero e numero, sem "R$", sem
   milhar, decimal com ponto); a formatacao pt-BR fica so na tela. O XLSX e um
   zip "stored" minimo escrito a mao — sem biblioteca externa, porque o painel
   nao pode depender de rede.                                                */
const RAW={};
// D-51: a exportacao das matrizes leva as linhas VISIVEIS (expansao atual).
const NOME_TAB={tabHier:"hierarquia", tabBan:"bandeiras", tabCat:"categorias"};
function nr(v,c=2){ if(v===null||v===undefined||!isFinite(v)) return null;
  const f=Math.pow(10,c); return Math.round(v*f)/f; }
function pctNum(v){ return (v===null||v===undefined||!isFinite(v))?null:v*100; }
function slug(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40); }
function nomeArquivo(id){
  const base = typeof NOME_TAB[id]==="function"?NOME_TAB[id]():(NOME_TAB[id]||id);
  const partes=[base];
  if(F.cat.size&&F.cat.size<=2) partes.push([...F.cat].map(i=>slug(D.cat[i])).join("+"));
  if(F.can.size&&F.can.size<=2) partes.push([...F.can].map(slug).join("+"));
  if(F.head.size&&F.head.size<=2) partes.push([...F.head].map(slug).join("+"));
  partes.push(F.base==="fis"?"ytd-fiscal":"ytd-calendario");
  const sel=selecionados();
  if(sel.length) partes.push(CAL[sel[sel.length-1]][C_AM]);
  return partes.filter(x=>x).join("_");
}
function registrarExport(id, cols, rows){
  RAW[id]={cols,rows};
  const tab=el(id); if(!tab) return;
  // v2: cada rerender volta a ordem padrao — o indicador ▾/▴ some junto.
  delete tab.dataset.ocol; delete tab.dataset.odir;
  const card=tab.closest(".card"); if(!card) return;
  const h3=card.querySelector("h3");
  if(!h3||h3.querySelector(".expbtns")) return;
  const sp=document.createElement("span"); sp.className="expbtns";
  sp.innerHTML='<button class="mini" data-exp="csv">↓ CSV</button>'
              +'<button class="mini" data-exp="xlsx">↓ XLSX</button>';
  sp.addEventListener("click",e=>{const b=e.target.closest("[data-exp]");
    if(b) exportarTabela(id,b.dataset.exp);});
  h3.appendChild(sp);
}
function _semHtml(s){ return String(s).replace(/<[^>]*>/g,""); }
function csvBlob(cols,rows){
  const esc=v=>{ if(v===null||v===undefined) return "";
    if(typeof v==="number") return String(v);
    const s=_semHtml(v);
    return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt="\ufeff"+[cols.map(esc).join(",")]
    .concat(rows.map(r=>r.map(esc).join(","))).join("\r\n");
  return new Blob([txt],{type:"text/csv;charset=utf-8"});
}
function crc32(u8){ if(!crc32.T){crc32.T=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);crc32.T[n]=c;}}
  let c=-1; for(let i=0;i<u8.length;i++) c=crc32.T[(c^u8[i])&255]^(c>>>8);
  return (c^-1)>>>0; }
function zipStore(files){
  const partes=[], cd=[]; let off=0;
  for(const f of files){
    const nome=new TextEncoder().encode(f.nome), crc=crc32(f.u8), n=f.u8.length;
    const lf=new DataView(new ArrayBuffer(30));
    lf.setUint32(0,0x04034b50,true); lf.setUint16(4,20,true); lf.setUint16(6,0x0800,true);
    lf.setUint32(14,crc,true); lf.setUint32(18,n,true); lf.setUint32(22,n,true);
    lf.setUint16(26,nome.length,true);
    partes.push(new Uint8Array(lf.buffer),nome,f.u8);
    const ce=new DataView(new ArrayBuffer(46));
    ce.setUint32(0,0x02014b50,true); ce.setUint16(4,20,true); ce.setUint16(6,20,true);
    ce.setUint16(8,0x0800,true);
    ce.setUint32(16,crc,true); ce.setUint32(20,n,true); ce.setUint32(24,n,true);
    ce.setUint16(28,nome.length,true); ce.setUint32(42,off,true);
    cd.push(new Uint8Array(ce.buffer),nome);
    off+=30+nome.length+n;
  }
  const cdLen=cd.reduce((s,u)=>s+u.length,0);
  const fim=new DataView(new ArrayBuffer(22));
  fim.setUint32(0,0x06054b50,true);
  fim.setUint16(8,files.length,true); fim.setUint16(10,files.length,true);
  fim.setUint32(12,cdLen,true); fim.setUint32(16,off,true);
  return new Blob([...partes,...cd,new Uint8Array(fim.buffer)],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function _xml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function xlsxBlob(cols,rows){
  const enc=new TextEncoder();
  const cel=v=>(typeof v==="number")?("<c><v>"+v+"</v></c>")
    :('<c t="inlineStr"><is><t xml:space="preserve">'
      +_xml(v===null||v===undefined?"":_semHtml(v))+"</t></is></c>");
  const linha=r=>"<row>"+r.map(cel).join("")+"</row>";
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'
    +linha(cols)+rows.map(linha).join("")+"</sheetData></worksheet>";
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
    +'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    +'<sheets><sheet name="dados" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +'<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  return zipStore([
    {nome:"[Content_Types].xml",u8:enc.encode(ct)},
    {nome:"_rels/.rels",u8:enc.encode(rels)},
    {nome:"xl/workbook.xml",u8:enc.encode(wb)},
    {nome:"xl/_rels/workbook.xml.rels",u8:enc.encode(wbRels)},
    {nome:"xl/worksheets/sheet1.xml",u8:enc.encode(sheet)},
  ]);
}
function exportarTabela(id,fmt){
  const d=RAW[id]; if(!d) return;
  const blob=fmt==="xlsx"?xlsxBlob(d.cols,d.rows):csvBlob(d.cols,d.rows);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=nomeArquivo(id)+"."+fmt;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

/* D-51: o drill-down inteiro (abrirDrill/renderDrill*) saiu — toda a
   navegacao entre niveis passou a ser a expansao das matrizes (Q11). */

/* D-49: a secao de metas (D-44 aba Metas + L3-F Meta x Realizado) saiu com
   a remocao do tema Metas. Reintegracao futura: docs/12 (D-49). */

/* ==================================================== ordenacao (v2)
   Clique no cabecalho ordena QUALQUER tabela do painel — o cursor:pointer que
   o v1 prometia sem entregar. So reordena a EXIBICAO: a exportacao CSV/XLSX
   mantem a ordem original do render (que ja e a ordem de negocio: maior
   valor, maior queda etc.). Primeiro clique = decrescente; segundo = crescente.
   Rerender de qualquer tabela volta a ordem padrao (dataset limpo no
   registrarExport/vazio).                                                   */
function valorOrdenacao(td, textual){
  const t=td.textContent.replace(/ /g," ").trim();
  if(textual) return t ? t : null;
  if(!t || t==="n/d" || t==="—") return null;
  // Formato pt-BR abreviado: "R$ 1,17 bi", "−R$ 2,30 mi", "▼ −5,0%", "1.234".
  const m=t.replace(/\./g,"").match(/\d+(?:,\d+)?/);
  if(!m) return null;
  let v=parseFloat(m[0].replace(",","."));
  if(/\bbi\b/.test(t)) v*=1e9;
  else if(/\bmi\b/.test(t)) v*=1e6;
  else if(/\bmil\b/.test(t)) v*=1e3;
  if(/[−▼]/.test(t)) v=-v;
  return v;
}
function ordenarTabela(tab, col){
  /* D-51: a matriz expansivel tem hierarquia nas LINHAS — reordenar por
     coluna rasgaria pai e filho. A ordenacao por clique vale nas demais. */
  if(tab.classList.contains("niveis")) return;
  const tb=tab.tBodies[0]; if(!tb) return;
  const desc = !(tab.dataset.ocol===String(col) && tab.dataset.odir==="desc");
  tab.dataset.ocol=String(col); tab.dataset.odir=desc?"desc":"asc";
  /* v3 (F1-G): na matriz a primeira coluna e o NUMERO da posicao, nao o
     rotulo — a regra antiga ordenaria "1, 10, 11, 2" como texto. A matriz
     declara suas colunas de texto no cabecalho (data-txt); as demais tabelas
     seguem a regra de sempre. */
  const hc = tab.tHead && tab.tHead.rows[0] ? tab.tHead.rows[0].cells[col] : null;
  const textual = (hc && tab.classList.contains("matriz"))
    ? hc.dataset.txt==="1" : col===0;
  const linhas=[...tb.rows].map((r,i)=>({r,i,v:valorOrdenacao(r.cells[col],textual)}));
  linhas.sort((a,b)=>{
    if(a.v===null && b.v===null) return a.i-b.i;
    if(a.v===null) return 1;                    // n/d sempre por ultimo
    if(b.v===null) return -1;
    const c = textual ? String(a.v).localeCompare(String(b.v),"pt-BR") : a.v-b.v;
    return c===0 ? a.i-b.i : (desc ? -c : c);
  });
  linhas.forEach(x=>tb.appendChild(x.r));
  tab.querySelectorAll("thead th").forEach((h,i)=>{
    h.classList.toggle("o-desc", i===col && desc);
    h.classList.toggle("o-asc",  i===col && !desc);
  });
}

/* ============================================== recorte persistente (v2)
   O estado dos filtros e serializado por ROTULO — nunca por indice, porque
   indices mudam entre cargas mensais e um recorte antigo apontaria para o
   item errado EM SILENCIO. Rotulo que nao existir mais na base e descartado.
   Vai para dois lugares: o hash da URL (#r=…, compartilhavel por link) e o
   localStorage (reabrir por duplo clique volta onde parou). Hash presente
   vence o localStorage.                                                     */
// P2-D: cada arquivo por head guarda o proprio recorte — sem o sufixo, o
// arquivo do head A clobberaria o recorte salvo do painel completo (mesma
// origem, mesma chave de localStorage).
function recorteAtual(){
  return {
    metrica:F.metrica, base:F.base, gran:F.gran, fy:F.fy, ano:F.ano,
    meses:[...F.meses].map(i=>CAL[i][C_AM]),
    cat:[...F.cat].map(i=>D.cat[i]),
    can:[...F.can], head:[...F.head],
    topBan:F.topBan, aba:F.aba,
    fAberto:!el("fPainel").classList.contains("fechado")
  };
}
function aplicarRecorte(r){
  if(!r || typeof r!=="object") return;
  const idx=(arr,rot)=>{ const i=arr.indexOf(rot); return i>=0?i:null; };
  if(METRICAS[r.metrica]) F.metrica=r.metrica;
  if(BASES[r.base]) F.base=r.base;
  if(GRANS[r.gran]) F.gran=r.gran;
  const fys=[...new Set(CAL.map(c=>c[C_FYROT]))];
  const anos=[...new Set(CAL.map(c=>c[C_ANO]))];
  if(fys.includes(r.fy)) F.fy=r.fy;
  if(anos.includes(r.ano)) F.ano=r.ano;
  if(Array.isArray(r.meses)){
    F.meses.clear();
    const am=CAL.map(c=>c[C_AM]);
    r.meses.forEach(x=>{ const i=am.indexOf(x); if(i>=0) F.meses.add(i); });
  }
  const setDe=(alvo,rots,mapa)=>{ if(!Array.isArray(rots)) return;
    alvo.clear();
    rots.forEach(x=>{ const v=mapa(x); if(v!==null&&v!==undefined) alvo.add(v); }); };
  setDe(F.cat, r.cat, x=>idx(D.cat,x));
  setDe(F.can, r.can, x=>D.canal.includes(x)?x:null);
  setDe(F.head,r.head,x=>D.head.includes(x)?x:null);
  if(DB.tops.ban.includes(r.topBan)) F.topBan=r.topBan;
  // D-51: recorte salvo em aba que nao existe mais cai na Visao Geral.
  if(["geral","band","catg"].includes(r.aba)) F.aba=r.aba;
  if(r.fAberto) el("fPainel").classList.remove("fechado");
}
function gravarRecorte(){
  const j=JSON.stringify(recorteAtual());
  try{ localStorage.setItem(CHAVE_LS, j); }catch(e){ /* file:// pode bloquear */ }
  try{ history.replaceState(null,"","#r="+encodeURIComponent(j)); }
  catch(e){ /* replaceState pode falhar em file:// — o localStorage cobre */ }
}
function lerRecorteInicial(){
  if(location.hash.startsWith("#r=")){
    try{ return JSON.parse(decodeURIComponent(location.hash.slice(3))); }
    catch(e){ /* hash corrompido: ignora e cai no localStorage */ }
  }
  try{ const s=localStorage.getItem(CHAVE_LS); if(s) return JSON.parse(s); }
  catch(e){}
  return null;
}
function atualizarToggle(){
  const fechado=el("fPainel").classList.contains("fechado");
  el("fToggle").textContent=(fechado?"▸":"▾")+" Filtros";
}
async function copiarRecorte(){
  gravarRecorte();                       // garante que o hash esta atualizado
  const url=location.href;
  let ok=false;
  try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){}
  if(!ok){
    const ta=document.createElement("textarea");
    ta.value=url; document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove();
  }
  const b=el("copiarLink"), original="Copiar recorte";
  b.textContent = ok ? "✓ link copiado" : "copie da barra de endereço";
  setTimeout(()=>{ b.textContent=original; }, 1800);
}

/* ================================================================ eventos */
function ligarChips(id, aoClicar){
  el(id).addEventListener("click", e=>{
    const c=e.target.closest(".chip");
    if(!c) return;
    aoClicar(c.dataset.k, c);
    render();
  });
}
function alterna(conj, v){ conj.has(v) ? conj.delete(v) : conj.add(v); }

function ligar(){
  ligarChips("fMetrica", k=>{ F.metrica=k; montarFiltros(); });
  ligarChips("fBase", k=>{ F.base=k; preSelecionarMeses(); montarFiltros(); });
  el("fAno").addEventListener("click", e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    if(c.dataset.t==="fy") F.fy=c.dataset.k; else F.ano=+c.dataset.k;
    preSelecionarMeses(); montarFiltros(); render();
  });
  // D-54: mexer nos meses muda quais canais/categorias/heads ainda tem dado,
  // entao o painel inteiro de filtros e remontado (montarFiltros ja chama
  // montarMeses). Antes so a linha de Meses era redesenhada e os demais chips
  // ficavam descrevendo um periodo que nao era mais o selecionado.
  ligarChips("fMeses", k=>{ alterna(F.meses,+k); montarFiltros(); });
  el("mTodos").onclick=()=>{ mesesOferecidos().forEach(i=>F.meses.add(i)); montarFiltros(); render(); };
  el("mNenhum").onclick=()=>{ F.meses.clear(); montarFiltros(); render(); };
  ligarChips("fCat", k=>{ alterna(F.cat,+k); montarFiltros(); });
  ligarChips("fCanal", k=>{ alterna(F.can,k); montarFiltros(); });
  ligarChips("fHead", k=>{ alterna(F.head,k); montarFiltros(); });
  ligarChips("topBan", k=>{ F.topBan=+k; montarFiltros(); });
  /* v3 (F1-A): delegacao no container, que montarPeriodo() nunca substitui.
     L3-B: sobrou so o "Ver por" (muda a granularidade da exibicao). */
  ALVOS_PERIODO.forEach(id=>{
    const e=el(id); if(!e) return;
    e.addEventListener("click", ev=>{
      const c=ev.target.closest(".chip");
      if(!c) return;
      if(c.dataset.g){ F.gran=c.dataset.g; render(); }
    });
  });
  el("fToggle").onclick=()=>{
    el("fPainel").classList.toggle("fechado");
    atualizarToggle(); gravarRecorte();
  };
  el("copiarLink").onclick=copiarRecorte;
  // v2: ordenacao por clique no cabecalho, em qualquer tabela com dados.
  document.addEventListener("click", e=>{
    const th=e.target.closest("th"); if(!th) return;
    const tab=th.closest("table");
    if(!tab || !tab.tBodies.length) return;
    const tb=tab.tBodies[0];
    if(tb.rows.length<2) return;                  // vazia ou so a msg de vazio
    ordenarTabela(tab, th.cellIndex);
  });
  el("limpar").onclick=()=>{
    ["cat","head","can"].forEach(k=>F[k].clear());
    preSelecionarMeses();
    montarFiltros(); render();
  };
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    el(t.dataset.p).classList.add("active");
    F.aba=t.dataset.p;
    posicionarFiltros(F.aba);       // P2-A3: o painel de filtros acompanha
    renderAba(F.aba);               // B1: renderiza sob demanda, se suja
    gravarRecorte();                // v2: a aba tambem faz parte do recorte
  });
}

/* ================================================ periodo inicial (D-63)
   Ate a D-62 o painel abria no ULTIMO ano fiscal da serie com TODOS os meses
   dele marcados. Em setembro isso e UM mes, parcial: KPIs a -90%, "Maiores
   quedas" cheio de "-100% sem faturamento", grafico com uma barra — em todos
   os 73 arquivos (observado em 03/09/2026; nunca tinha sido decisao).
   Regra de 03/09: abrir no FY corrente ATE O ULTIMO MES FECHADO; se o FY
   corrente ainda nao tem mes fechado, abrir no FY ANTERIOR inteiro, que tem
   par completo no ano anterior. "Fechado" = competencia estritamente anterior
   ao mes da geracao (a mesma regua do saneamento, D-50/Q6), lida de
   DB.meta.gerado_em. O mes parcial continua nos chips de Meses; so nao e o
   que se ve sem querer. Trocar de base/ano pelos chips segue selecionando o
   ano inteiro (preSelecionarMeses): la a escolha e do usuario.             */
function mesDaGeracao(){
  const m=String(DB.meta&&DB.meta.gerado_em||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3]+"-"+m[2] : null;
}
function periodoInicial(){
  const fys=[...new Set(CAL.map(c=>c[C_FYROT]))];
  const anos=[...new Set(CAL.map(c=>c[C_ANO]))];
  F.ano=anos[anos.length-1];
  const exec=mesDaGeracao();
  const fechado=i=> exec ? CAL[i][C_AM] < exec : true;
  let fy=fys[fys.length-1], meses=mesesDoFY(fy).filter(fechado);
  if(!meses.length && fys.length>1){
    fy=fys[fys.length-2]; meses=mesesDoFY(fy).filter(fechado);
  }
  F.fy=fy; F.meses.clear(); meses.forEach(i=>F.meses.add(i));
  if(!F.meses.size) preSelecionarMeses();   // serie sem mes fechado: tudo
}

function iniciar(){
  /* P2-D: arquivo gerado por head. A marca so DECLARA o recorte no titulo e
     no cabecalho; a restricao de verdade e do run_dashboard.py, que nao
     embute neste arquivo nenhuma linha de cubo de outro head. */
  if(DB.meta.recorte){
    document.title += " · " + DB.meta.recorte;
    const sp=document.querySelector("h1 span");
    if(sp) sp.textContent = "· Sell In · " + DB.meta.recorte;
  }
  // L3-D (Q4): no arquivo por head a LINHA do filtro Head fica oculta — o
  // componente, a logica e os listeners continuam; e visibilidade por perfil,
  // nunca remocao. Nos demais perfis nada muda.
  // D-52: so o Template Full tem o filtro Head — nos arquivos por nivel a
  // linha fica oculta (ocultar/remover, nunca acinzentar).
  if(RESTRITO) el("frowHead").hidden=true;
  periodoInicial();                          // D-63
  // v2: reabre no recorte do link (#r=…) ou, sem link, no ultimo recorte
  // salvo neste navegador. Sem nenhum dos dois, fica o padrao acima.
  aplicarRecorte(lerRecorteInicial());
  // L3-G (Q3-b): o rodape textual saiu de todos os arquivos — o contexto da
  // carga continua em resumo.json e em data/quality/relatorio_qualidade.md.
  montarFiltros(); ligar();
  document.querySelectorAll(".tab").forEach(t=>{   // restaura a aba do recorte
    const on=t.dataset.p===F.aba;
    t.classList.toggle("active", on);
    el(t.dataset.p).classList.toggle("active", on);
  });
  posicionarFiltros(F.aba);   // P2-A3: recorte pode reabrir fora da Visao Geral
  atualizarToggle();
  render();
}

/* D-48: o painel so "liga" depois que os cubos chegam descompactados. Falha
   aqui vira MENSAGEM na tela — nunca pagina em branco sem explicacao. */
(async function(){
  try{
    DB = await carregarDB(DB_CARGA);
    prepararDB();
    iniciar();
  }catch(e){
    document.body.innerHTML =
      '<div style="max-width:720px;margin:80px auto;'
      + 'font:15px/1.6 system-ui,Segoe UI,Arial">'
      + '<h2>Nao foi possivel abrir o painel</h2><p>'
      + String(e && e.message ? e.message : e).replace(/</g,"&lt;")
      + '</p><p>Gere o painel de novo com <code>python run_dashboard.py</code>.'
      + '</p></div>';
  }
})();
</script>
