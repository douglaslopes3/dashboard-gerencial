# =============================================================================
# Dashboard Gerencial de Canais (Sell In) — configuração
#
# REGRA: nenhum valor de negócio mora no código. Canal, categoria, head, UF,
# bandeira, cliente, SKU, período e ano NUNCA aparecem aqui como lista fixa —
# eles saem das bases. O que mora aqui é PARÂMETRO: pastas, formatos, nomes de
# coluna de ORIGEM, tolerâncias, cortes de exibição e correções DECLARADAS.
#
# Todos os caminhos são relativos à raiz do projeto.
# =============================================================================

projeto:
  nome: "Dashboard Gerencial de Canais — Sell In"
  pasta_dados: "data"
  pasta_logs: "logs"
  pasta_docs: "docs"

# -----------------------------------------------------------------------------
# FONTES
# -----------------------------------------------------------------------------
fontes:

  sellin:
    # DUAS pastas de entrada, de propósito:
    #   - `bases/Sell In` é onde os 28 arquivos já estavam;
    #   - `data/raw/sell_in` é a pasta do ciclo mensal (§1 do prompt).
    # As duas são varridas. Largar o arquivo novo em qualquer uma funciona, e
    # nenhum Excel precisou ser movido. Ver decisão D-03.
    pastas:
      - "bases/Sell In"
      - "data/raw/sell_in"
    padroes_aceitos: ["*.xlsx", "*.xlsm"]
    aba: "Export"
    # A linha de rodapé com a coluna `Ano` = "Total" é o gabarito de conferência.
    ultima_linha_e_total: true
    rotulo_linha_total: "total"
    # Colunas OBRIGATÓRIAS. Faltando qualquer uma, o arquivo é REJEITADO e o
    # pipeline aborta — nunca ingerido pela metade.
    colunas_obrigatorias:
      - "Ano"
      - "Ano mês"
      - "Cód. cliente"
      - "Cliente"
      - "Bandeira cliente"
      - "Estado"
      - "Desc. categoria"
      - "Cód. material"
      - "Desc. material sem código"
      - "Receita Líquida"
      - "Peso Líquido"
      - "Qtde Faturado"
    # Colunas opcionais: se aparecerem, são lidas; se não, o pipeline segue
    # (o leitor avisa quando uma declarada aqui não tiver destino — C4).
    # `Subcanal` está aqui à espera do BI — ver GAP-01. Basta a extração passar
    # a trazê-la que ela entra na DIM_CLIENTE sem tocar em código.
    # `Comissão Faturada Líquida` existe na fonte e NÃO é ingerida — fora do
    # escopo do MVP (auditoria, C4: antes estava listada como se fosse lida).
    colunas_opcionais:
      - "Subcanal"
      - "Representante"
    # D-36 (28/08/2026): linha com receita, peso E caixas zerados/nulos nao
    # carrega fato mensuravel — mas cria cliente/canal/SKU fantasma nos eixos
    # do painel. Caso real: 19 linhas de nov/24 a R$ 0,00 (remessas simbolicas
    # de 3 clientes Makro/Sam's) sustentavam sozinhas o canal KEY ACCOUNT
    # NACIONAL. O descarte e contado no log e no relatorio de qualidade; as
    # linhas somam exatamente zero, entao a reconciliacao contra o gabarito
    # da fonte nao se altera.
    descartar_linhas_100_zeradas: true

  produtos:
    arquivo: "bases/Bases para tabelas dimensões/Produtos.xlsx"
    aba: "Produtos"
    colunas_obrigatorias: ["Código Produto", "Descrição Produto", "Categoria"]
    colunas_opcionais: ["Marca"]

  estrutura_comercial:
    # 02/10/2026 (D-83, Douglas): a Hierarquia_Consolidada saiu. A hierarquia
    # oficial e a Hierarquia_AAAAMMDD.xlsx da pasta COMPARTILHADA com o DN e o
    # ROTA (1 linha por cliente, N1-N4). Vale o arquivo de data MAIS RECENTE no
    # nome; arquivo do padrao sem data AAAAMMDD valida aborta (copia de conflito
    # do OneDrive nao vira desempate silencioso).
    # Rotulo de cada nivel = "codigo - nome" (mesmo formato no DN e no ROTA). O
    # nome e limpo so quando termina com "(codigo)" igual ao codigo da linha:
    # sai o "(codigo)" e o "_" inicial; fora disso entra como veio.
    # PROJETO saiu (decisao de 02/10): sem a coluna, o eixo do perfil fica com
    # o rotulo de ausencia, sem mudar o template.
    pasta: "../bases compartilhadas"
    padrao: "Hierarquia_*.xlsx"
    data_regex: '^Hierarquia_(\d{8})\.xlsx$'
    aba: "Hierarquia Vendas"
    coluna_cliente: "Cód. cliente"
    niveis:                       # nivel -> [coluna do codigo, coluna do nome]
      HEAD: ["Cód. Head Vendas (N1)", "Nome Head Vendas (N1)"]
      GERENTE: ["Cód. Gerente Vendas (N2)", "Nome Gerente Vendas (N2)"]
      SUPERVISOR: ["Cód. Executivo Vendas (N3)", "Nome Executivo Vendas (N3)"]
      VENDEDOR: ["Cód. Representante (N4)", "Nome Representante (N4)"]
    # A ausência da hierarquia NÃO derruba o pipeline: o painel roda sem
    # hierarquia, com todo mundo em "NÃO ATRIBUÍDO" e um aviso na tela.
    obrigatorio: false

  # 02/10/2026 (D-83): CÓDIGO BANDEIRA/BANDEIRA do cadastro passam a vir da
  # Estrutura de Clientes da mesma pasta compartilhada (antes vinham da
  # Hierarquia_Consolidada, D-42). Ligacao pelo codigo do cliente. Uso: atributo
  # do cadastro e bandeira do cliente SO com meta (sem sell-in, D-74); a bandeira
  # da tela continua sendo a do sell-in.
  estrutura_clientes:
    pasta: "../bases compartilhadas"
    padrao: "Estrutura de Clientes_*.xlsx"
    data_regex: '^Estrutura de Clientes_(\d{8})\.xlsx$'
    aba: "Planilha1"
    coluna_cliente: "Cód. cliente"
    coluna_cod_bandeira: "Cód. Bandeira cliente"
    coluna_bandeira: "Bandeira cliente"
    obrigatorio: false
    # COMPLEMENTO (D-34) — APOSENTADO na D-49 (02/09/2026, decisao do Douglas):
    # o Hierarquia_Complemento.xlsx foi excluido de bases/ em definitivo. Os
    # 2.612 clientes dele viraram duas bases novas, tratadas na Fase 2 da
    # reestruturacao: RTM-Transicao (1.762, reatribuicao ao distribuidor) e
    # Hierarquia_Clientes_Faltando (850, saneamento SIM/NAO). Ate a Fase 2
    # entrar, esses clientes ficam "NÃO ATRIBUÍDO" — ver o piso reduzido em
    # `validacao.cobertura_minima_head`.

  # D-49 (02/09/2026): o bloco `fontes.metas` saiu com a remocao do tema Metas
  # (leitor da base FY 26/27, FATO_META e CUBO_META rota A). O novo arquivo de
  # metas, quando chegar, sera cruzado pela CHAVE DO CLIENTE — o ponto de
  # reintegracao esta documentado em docs/12 (D-49). `bases/Metas/` permanece
  # intocada (origem e so leitura).

  # De-para Cliente -> Canal, entregue em 26/08/2026 (resolve o GAP-01).
  # Cobertura medida na entrega: 100,0000% dos 16.131 clientes e da receita.
  canais:
    arquivo: "bases/Canais/Canais.xlsx"
    aba: "Export"
    colunas_obrigatorias: ["Cód. cliente", "Canal"]
    colunas_opcionais: ["Cód. canal", "Subcanal"]
    obrigatorio: false

  # D-50 (Fase 2, Step 4): clientes que sairam do atendimento direto para
  # distribuidor. O sell-in deles (historico E futuro, decisao Q3) passa a
  # carregar a hierarquia e o canal do DISTRIBUIDOR que os atende; UF e o
  # proprio cliente sao preservados na linha. A BANDEIRA tambem passou a ser
  # a do distribuidor na D-59 (03/09/2026; parametro
  # `saneamento.rtm_herda_bandeira`, abaixo) — a Q4-a original a preservava.
  # "Dsitribuidor" esta grafado assim NA ORIGEM — nao corrigir aqui.
  rtm_transicao:
    arquivo: "bases/RTM-Transicao/RTM_DePara_Transicao.xlsx"
    aba: "De-Para RTM"
    colunas_obrigatorias:
      - "Cód. Cliente [Antigo]"
      - "Bandeira cliente [Antigo]"
      - "Dsitribuidor Nome Reduzido"
      - "Cód. Cliente [Distribuidor]"
    # Sem o arquivo o pipeline RODA (sem reatribuicao, com aviso).
    obrigatorio: false

  # D-50 (Fase 2, Step 5): clientes sem vinculo na hierarquia consolidada.
  # A coluna Hierarquia (SIM/NAO) decide o tratamento — ver `saneamento`.
  # DESLIGADA em 02/10/2026 (D-83, opcao B do Douglas): a Hierarquia_20261001
  # cobre 849 dos 850 clientes desta lista (607 dos 608 inativados e os 162
  # pendentes da Q5 tem posicao real), entao o saneamento por ela deixou de
  # valer. Vazio = nenhum cliente e inativado e nada fica pendente. Para
  # religar, restaurar o bloco (arquivo, aba, colunas) do backup
  # _arquivo/backups-pre-fases/backup_2026-10-02_pre_hierarquia/config.yaml.
  hierarquia_faltando: {}

  # D-74 (08/09/2026): METAS por CLIENTE x CATEGORIA x MES (formato longo,
  # uma linha por tipo de meta). Substitui a base FY 26/27 por bandeira que
  # saiu na D-49. Regras medidas na analise de 08/09:
  #   - a PASTA inteira e varrida (Q2): tanto um arquivo que cresce quanto um
  #     por ano fiscal funcionam; a competencia vem do CONTEUDO (coluna
  #     Periodo: data, serial do Excel ou texto AAAA-MM), nunca do nome;
  #   - o MESMO mes em dois arquivos ABORTA (substituir, nunca adicionar);
  #   - a meta de um mes ja carregado pode mudar (Q3): o arquivo atual e a
  #     verdade e a mudanca fica REGISTRADA em data/quality/metas_revisoes.csv;
  #   - categoria que nao existe no modelo ABORTA (Q5); cliente que nunca
  #     faturou entra na DIM_CLIENTE pela Hierarquia_Consolidada (Q4);
  #   - meta negativa entra como esta (Q1) e sai listada em
  #     data/quality/metas_negativas*.csv;
  #   - sem arquivo nenhum o painel roda SEM meta (ausencia, nunca zero).
  metas:
    pasta: "bases/Metas"
    padroes_aceitos: ["*.xlsx", "*.xlsm"]
    # null = primeira aba (o nome da aba carrega o ano fiscal: "Metas FY27").
    aba: null
    colunas_obrigatorias: ["CÓDIGO CLIENTE", "CATEGORIA", "Período", "Tipo Meta", "Valor"]
    # Valor da coluna "Tipo Meta" -> metrica da FATO_META. Tipo que nao esta
    # aqui ABORTA (nao e ignorado): o arquivo e que precisa ser conferido.
    tipos_meta:
      "VALOR (R$)": "META_RECEITA"
      "VOLUME (KG)": "META_PESO_KG"
    obrigatorio: false

# -----------------------------------------------------------------------------
# SANEAMENTO DA HIERARQUIA (D-50, Step 5) — parametros, nunca hardcode
# -----------------------------------------------------------------------------
saneamento:
  # 5.2: cliente com Hierarquia=NAO e SEM sell-in nesta janela e INATIVO
  # (sai da matriz hierarquica; o historico permanece nos totais — Q7-i).
  janela_meses: 6
  # Ancora da janela (decisao Q6): "ultima_competencia_fechada" = a ultima
  # competencia do fato ESTRITAMENTE anterior ao mes-calendario da execucao.
  # Mes parcial nao "ressuscita" cliente, e a regua nao muda a cada carga.
  ancora_janela: "ultima_competencia_fechada"

  # D-59 (03/09/2026) — o cliente RTM herda tambem a BANDEIRA do distribuidor.
  #
  # A Q4-a (D-50) preservava a bandeira do ponto final "para a aba Bandeiras
  # nao perder historico". Medido em 03/09/2026, o historico protegido quase
  # nao existia: das 1.040 bandeiras afetadas, praticamente todas vivem SO
  # atraves de clientes RTM — mudam de rotulo inteiras, nao se partem (a
  # excecao material e MASTER). Em troca, o painel do head de Distribuicao
  # mostrava 1.111 bandeiras de mercadinho no lugar dos 27 distribuidores,
  # que sao os clientes reais dele (medido depois de ligar: 66 bandeiras no
  # painel dele, 60 nominais + 6 no balde). Custo medido: R$ 82,8 mi (3,56%
  # da receita) trocam de rotulo; nenhum centavo sai do total.
  #
  # A herança vem da bandeira do PROPRIO distribuidor (a do sell-in dele),
  # nao do nome do cadastro — e assim que o distribuidor e seus clientes
  # caem na MESMA linha da aba Bandeiras.
  #
  # `false` volta ao comportamento da Q4-a sem tocar em codigo. A bandeira de
  # origem fica sempre em DIM_CLIENTE.BANDEIRA_ORIGINAL, nos dois modos.
  rtm_herda_bandeira: true

# -----------------------------------------------------------------------------
# CALENDÁRIO
# -----------------------------------------------------------------------------
calendario:
  # Mês de início do ano fiscal. 9 = setembro. Trocar para 1 iguala fiscal e
  # calendário sem tocar em uma linha de código.
  fiscal_mes_inicio: 9
  # O ano fiscal é nomeado pelo ano de FECHAMENTO: set/2025..ago/2026 = 2026.
  # Confere com o §7 do prompt ("set/2025 a ago/2026 = FY2026"). Ver D-02.
  fiscal_prefixo: "FY"

# -----------------------------------------------------------------------------
# DIMENSÕES — correções DECLARADAS
#
# Toda chave abaixo nasce VAZIA. Correção de rótulo é decisão de negócio: quando
# alguém preencher, a troca acontece e sai no log e no relatório de qualidade.
# NENHUMA correção acontece em silêncio.
# -----------------------------------------------------------------------------
dimensoes:
  estrutura_comercial:
    # Padronização aprovada em 28/08/2026 (D-34): a Hierarquia_Consolidada
    # grafa o mesmo posto vago ora "[VAGO]", ora "[Vago]" — sem a correção o
    # painel mostraria DOIS heads para o mesmo código 30. O padrão é [VAGO].
    # As 106 linhas do gerente 33000 sem nome nenhum recebem o [VAGO] também,
    # senão viram um segundo rótulo do mesmo gerente.
    # (A correção do Maykon, da base anterior, saiu com ela — D-34.)
    # 02/10/2026 (D-83): as 5 correcoes de "[Vago]" sairam com a troca da base;
    # o rotulo agora e "codigo - nome" e a Hierarquia_AAAAMMDD grafa a vaga de
    # um jeito so por codigo (medido: 1 nome por codigo nos 4 niveis).
    correcoes_head: {}
    correcoes_gerente: {}
    correcoes_supervisor: {}
    correcoes_vendedor: {}
    # Cliente com duas linhas e supervisores diferentes: declare aqui quem vence.
    # Sem declaração, vence a 1a linha COM AVISO.
    # ex.: "1010846": "Supervisor SP Interior"
    desempate_cliente: {}
  # Rótulos usados para quem não tem linha num de-para. Não são valores de
  # negócio inventados: são a marca explícita de ausência — e moram AQUI para
  # o relatório de qualidade e as dimensões lerem a MESMA string (auditoria,
  # C2: os três de baixo estavam duplicados em dois módulos).
  rotulo_sem_estrutura: "NÃO ATRIBUÍDO"
  # D-50 (Q7-i): cliente inativado pelo saneamento sai da matriz hierarquica
  # mas o historico dele PERMANECE nos totais — este rotulo e o balde proprio
  # que a matriz exibe como linha sintese "fora da hierarquia".
  rotulo_inativo: "INATIVO (SANEAMENTO)"
  rotulo_sem_canal: "SEM CANAL"
  rotulo_sem_bandeira: "SEM BANDEIRA"
  rotulo_sem_uf: "SEM UF"
  rotulo_sem_categoria: "NAO INFORMADO"

# -----------------------------------------------------------------------------
# VALIDAÇÃO
# -----------------------------------------------------------------------------
validacao:
  # Soma dos dados x linha `Total` da fonte, por arquivo.
  tolerancia_receita_reais: 0.01
  tolerancia_peso_kg: 0.01
  tolerancia_caixas: 0.01
  # Soma do cubo x soma da fato (erro relativo).
  tolerancia_cubo_relativa: 0.000001
  # Piso de cobertura da estrutura comercial sobre a receita. Abaixo disso o
  # pipeline ABORTA. Existe por um erro real do projeto anterior: `Cód. cliente`
  # zero-preenchido faz o join casar com ZERO cliente — e casar em silêncio.
  # D-49 baixou o piso para 0.93 temporariamente (aposentadoria do
  # complemento); a D-50 (Fase 2) reatribuiu os clientes RTM aos
  # distribuidores e a cobertura medida voltou a 97,65% — piso restaurado.
  cobertura_minima_head: 0.95
  # Mesmo piso para o de-para de canais — o arquivo tambem traz o codigo
  # zero-preenchido, entao o mesmo join silencioso e possivel.
  cobertura_minima_canal: 0.95
  # Lista de valores esperados só para CONFERIR (§9 do prompt). O que não estiver
  # aqui vira linha em data/quality/valores_nao_reconhecidos.csv.
  # ISTO NÃO FILTRA, NÃO CORRIGE E NÃO ORDENA NADA. É só o gabarito do relatório.
  valores_esperados:
    categoria:
      ["AMENDOIM", "BALA", "CHOCOLATE", "COMPOUND", "GELATINA", "GOMAS",
       "GRANULADO", "JUBES FRUIT SNACK", "PIRULITO", "REGALIZ"]
    # 02/10/2026 (D-83): rotulos "codigo - nome" da Hierarquia_20261001
    head: ["10 - MICHEL", "20 - ADEMIR", "30 - KAN_VAGO", "40 - IZABELA"]
    canal:
      ["ATACADO ESPECIALIZADO", "ATACADO GENERALISTA", "VAREJO ESPECIALIZADO",
       "VAREJO", "CASH & CARRY", "NOVOS CANAIS", "DISTRIBUIDOR"]

# -----------------------------------------------------------------------------
# DASHBOARD
# -----------------------------------------------------------------------------
dashboard:
  # D-51 (Fase 3): o painel ativo passou a ser o TEMPLATE V4 (3 abas + matriz
  # hierarquica). O template_v3.html fica na pasta como retorno rapido, com a
  # ressalva: ele le cubos COM o eixo UF — para reativa-lo e preciso voltar
  # tambem o pipeline (git checkout do commit da D-50 ou anterior).
  # D-58 (03/09/2026, pedido do Douglas): "_Canais_v4" saiu dos nomes de
  # arquivo. O sufixo de versao no nome do entregavel envelhece — a versao do
  # template ja e rastreada no config (`template:`) e no git. Nomes novos:
  # Dashboard_Gerencial.html e Dashboard_Gerencial_<NIVEL>_<colaborador>.html
  arquivo_saida: "Dashboard_Gerencial.html"
  template: "dashboard/template_v4.html"
  pasta_saida: "dashboard/build"
  libs:
    chart: "dashboard/lib/chart.umd.min.js"
  marcador_inicio: "/*DADOS_INICIO*/"
  marcador_fim: "/*DADOS_FIM*/"

  # D-65 (03/09/2026): o cubo carrega TODAS as bandeiras (medido: 495.037
  # linhas no principal, contra 123.900 com o corte antigo; coube porque a
  # D-64 tirou o eixo morto do cubo de SKU). `top_bandeiras` virou corte de
  # EXIBICAO: no Full e nos arquivos N1 a tabela mostra as N maiores DO
  # PROPRIO ARQUIVO e soma o resto numa linha Σ montada na tela; a busca
  # acha qualquer bandeira, dentro ou fora do corte. Nos niveis listados em
  # `exibir_todas_bandeiras_em` nao ha corte nem Σ (medido: N3 max. 2.930
  # bandeiras, N2 max. 3.415 — cabe com rolagem).
  top_bandeiras: 300
  rotulo_demais_bandeiras: "DEMAIS BANDEIRAS"
  exibir_todas_bandeiras_em: ["N2", "N3"]

  # D-68 (03/09/2026): como as linhas sintese "fora da hierarquia" aparecem
  # NA TELA (matriz hierarquica e chip de Head do Full). As chaves de dado
  # continuam sendo `dimensoes.rotulo_sem_estrutura` / `rotulo_inativo`
  # (relatorio, CSVs, cubo); aqui e so o texto que o leitor ve. Vazio = mostra
  # a chave.
  rotulos_exibicao:
    sem_estrutura: "Sem estrutura comercial"
    inativo: "Inativos (sem sell-in há 6 meses)"
    # D-72 (04/09/2026): rotulo da linha Σ que acumula os clientes RTM sob o
    # distribuidor na aba Bandeiras. `{n}` vira a contagem de clientes RTM
    # com sell-in atras da linha (contagem fixa, do historico, como o "N
    # bandeiras" da linha Σ de bandeiras).
    rtm_acumulado: "RTM (soma de {n} clientes)"

  # D-72 (04/09/2026, decisao do Douglas): a aba Bandeiras abre por CLIENTE
  # (Bandeira > Cliente > Categoria). O cliente entrou como eixo do cubo
  # principal (indice 4 da linha, depois do perfil; as posicoes 1-3 que o
  # template le nao mudaram). Medido antes de decidir: 495.628 -> 724.744
  # linhas no Full com a regra abaixo ligada (831.155 sem ela).
  # Regra dele: "os clientes RTM nao devem aparecer na matriz de bandeira do
  # canal de Distribuicao; trazer acumulado" — com `true`, todo cliente RTM
  # que HERDOU a bandeira do distribuidor (DIM_CLIENTE.BANDEIRA_HERDADA) e
  # somado numa linha unica por bandeira, rotulada por
  # `rotulos_exibicao.rtm_acumulado`. `false` mostra cada cliente RTM pelo
  # nome, como qualquer outro. A regra "acumula so quando herdou" garante que
  # com `saneamento.rtm_herda_bandeira: false` nada e acumulado.
  cliente_rtm_acumulado: true
  # D-74 (Q7-a, 08/09/2026): TETO de tamanho de um arquivo de painel, em MB.
  # Era 25 MB (acordo da D-48). Medido em 08/09: o Full tinha 17,6 MB e
  # cresce ~0,7 MB por mes de sell-in; a meta por cliente custa ~0,96 MB por
  # mes de meta no Full — com 12 meses de meta e o sell-in de ago/27 o Full
  # passa de 30 MB. Decisao do Douglas: 35 MB, com a abertura e o heap
  # medidos a cada rodada (o template registra os dois no console do
  # navegador; a medicao de 08/09 esta em docs/12 D-74). Acima do teto o
  # gerador ABORTA — subir o numero e decisao, nao acidente.
  teto_mb: 35

  # Quantos itens no bloco de destaque de ganhos/quedas.
  top_ranking: 10
  # Opções do seletor "Top" na aba Bandeiras. (O seletor de SKU saiu na D-51
  # junto com a aba de SKU — a matriz de Categorias abre TODOS os SKUs da
  # categoria expandida.)
  tops_bandeira: [10, 50, 100, 200, 300]

  # D-52 (Fase 4): um arquivo por COLABORADOR, do N1 ao N3, com o recorte
  # aplicado na GERACAO — o arquivo de um nivel so carrega as linhas de cubo
  # do proprio escopo; nao e filtro de interface. O N4 NAO gera arquivo
  # (decisao de 02/09: publicacao so ate N3; o N4 e o nivel expansivel dentro
  # do arquivo do N3). Os baldes "NÃO ATRIBUÍDO" e "INATIVO (SANEAMENTO)"
  # ficam de fora: nao sao escopo de ninguem.
  # A chave de cada nivel e a POSICAO do componente no perfil do cubo:
